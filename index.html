<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        #app-container {
            background-color: #121212;
            color: #E0E0E0;
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #intro-logo {
            max-width: 300px;
            width: 80%;
            animation: slideAndFade 4s ease-in-out forwards;
        }

        @keyframes slideAndFade {
            0% {
                transform: translateY(100vh);
                opacity: 1;
            }
            30% {
                transform: translateY(0);
                opacity: 1;
            }
            70% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(0);
                opacity: 0;
            }
        }

        #setup-screen {
            flex: 1;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            gap: 16px;
            text-align: center;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .title {
            margin: 0;
            font-size: 1.8rem;
            line-height: 1.2;
        }

        .subtitle {
            margin: 0;
            color: #bdbdbd;
            font-size: 0.95rem;
            max-width: 360px;
        }

        .major-grid {
            width: 100%;
            display: grid;
            gap: 12px;
            margin-top: 8px;
        }

        .major-btn {
            border: 1px solid #333;
            background: #1f1f1f;
            color: #fff;
            border-radius: 12px;
            padding: 14px 12px;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.35;
            cursor: pointer;
        }

        .major-btn strong {
            display: block;
            margin-bottom: 4px;
            font-size: 1.05rem;
        }

        .major-btn:active {
            transform: scale(0.99);
        }

        #game-ui {
            display: none;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            position: relative;
        }

        #stats-bar {
            flex-shrink: 0;
            background: #1E1E1E;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            height: 96px;
            padding: 8px 6px;
            gap: 6px;
        }

        .stat-block {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 6px 7px;
        }

        .stat-name {
            font-size: 0.68rem;
            color: #bdbdbd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-value {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-track {
            height: 8px;
            background: #2b2b2b;
            border-radius: 999px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 50%;
            border-radius: 999px;
            transition: width 0.2s ease;
        }

        #health-fill {
            background: #FF4C4C;
        }

        #happiness-fill {
            background: #FFD700;
        }

        #smarts-fill {
            background: #4C9AFF;
        }

        #event-log {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px 188px;
            min-height: 0;
        }

        #event-log p {
            margin: 0 0 10px;
            background: #191919;
            border: 1px solid #2b2b2b;
            border-radius: 10px;
            padding: 10px 12px;
            line-height: 1.35;
            font-size: 0.95rem;
        }

        #action-area {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 65px;
            height: 0;
            flex-shrink: 0;
            z-index: 8;
            pointer-events: none;
        }

        #age-up-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #00C853, #64DD17);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.15;
            position: absolute;
            left: 50%;
            bottom: -40px;
            transform: translateX(-50%);
            z-index: 9;
            cursor: pointer;
            box-shadow: 0 16px 35px rgba(0, 200, 83, 0.5), 0 5px 12px rgba(0, 0, 0, 0.7);
            pointer-events: auto;
        }

        #age-up-btn:active {
            transform: translateX(-50%) scale(0.97);
        }

        #bottom-nav {
            flex-shrink: 0;
            height: 65px;
            background: #1E1E1E;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: stretch;
            position: relative;
            z-index: 3;
        }

        .nav-btn {
            flex: 1;
            height: 100%;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 0.92rem;
            cursor: pointer;
        }

        .nav-btn:active {
            background: rgba(255, 255, 255, 0.08);
        }

        #modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 20;
        }

        #modal-card {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 16px;
        }

        #modal-title {
            margin: 0 0 8px;
            font-size: 1.2rem;
        }

        #modal-description {
            margin: 0 0 14px;
            font-size: 0.95rem;
            color: #d2d2d2;
            line-height: 1.35;
        }

        #modal-actions {
            display: grid;
            gap: 10px;
        }

        .modal-btn {
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            background: #242424;
            color: #fff;
            padding: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
        }

        .modal-btn:active {
            transform: scale(0.995);
        }

        #death-screen {
            display: none;
            flex: 1;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 24px;
            gap: 14px;
        }

        #tombstone {
            font-size: 3rem;
            margin: 0;
        }

        #death-title {
            margin: 0;
            font-size: 1.5rem;
        }

        #death-summary,
        #death-life-note {
            margin: 0;
            color: #d6d6d6;
            line-height: 1.4;
        }

        #play-again-btn {
            margin-top: 4px;
            border: none;
            border-radius: 10px;
            background: #4C9AFF;
            color: #fff;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

                choices: [
                    { text: "Pay $100 for medicine.", effects: { cash: -100, health: 10, happiness: 5 } },
                    { text: "Tough it out.", effects: { health: -30, happiness: -20 } }
                ]
            }
        ];

        let yearlyProceduralEventTotal = 0;
        let yearlyProceduralEventRemaining = 0;

        function formatMoney(num) {
            return "$" + Math.round(num).toLocaleString("en-US");
        }

        function clampStat(num) {
            if (num < 0) return 0;
            if (num > 100) return 100;
            return num;
        }

        function updateUI() {
            state.health = clampStat(state.health);
            state.happiness = clampStat(state.happiness);
            state.smarts = clampStat(state.smarts);

            healthText.textContent = Math.round(state.health);
            happinessText.textContent = Math.round(state.happiness);
            smartsText.textContent = Math.round(state.smarts);
            cashBalanceText.textContent = formatMoney(state.cash);

            healthFill.style.width = state.health + "%";
            happinessFill.style.width = state.happiness + "%";
            smartsFill.style.width = state.smarts + "%";

            eventLog.scrollTop = eventLog.scrollHeight;
        }

        function logEvent(text) {
            const p = document.createElement("p");
            p.textContent = text;
            eventLog.appendChild(p);
        }

        function formatSignedMoney(value) {
            const abs = Math.abs(value);
            return (value >= 0 ? "+" : "-") + formatMoney(abs);
        }

        function describeEffects(effects) {
            const parts = [];
            if (typeof effects.cash === "number" && effects.cash !== 0) {
                parts.push(formatSignedMoney(effects.cash) + " Cash");
            }
            if (typeof effects.health === "number" && effects.health !== 0) {
                parts.push((effects.health > 0 ? "+" : "") + effects.health + " Health");
            }
            if (typeof effects.happiness === "number" && effects.happiness !== 0) {
                parts.push((effects.happiness > 0 ? "+" : "") + effects.happiness + " Happiness");
            }
            if (effects.death === true) {
                parts.push("Fatal");
            }
            return parts.length ? parts.join(" | ") : "No immediate change";
        }

        function openModal(title, description, actions) {
            modalTitle.textContent = title;
            modalDescription.textContent = description;
            modalActions.innerHTML = "";

            actions.forEach(function (action) {
                const btn = document.createElement("button");
                btn.className = "modal-btn";
                btn.textContent = action.label;
                if (action.disabled) {
                    btn.disabled = true;
                    btn.style.opacity = "0.45";
                    btn.style.cursor = "not-allowed";
                }
                btn.addEventListener("click", function () {
                    action.handler();
                });
                modalActions.appendChild(btn);
            });

            modalOverlay.style.display = "flex";
        }

        function closeModal() {
            modalOverlay.style.display = "none";
        }

        function applyProceduralEffects(effects) {
            state.cash += effects.cash || 0;
            state.health += effects.health || 0;
            state.happiness += effects.happiness || 0;

            if (effects.death === true || state.health <= 0) {
                state.health = 0;
                onPlayerDeath();
                return true;
            }
            return false;
        }

        function generateProceduralEvent() {
            const template = proceduralEventTemplates[Math.floor(Math.random() * proceduralEventTemplates.length)];
            const event = {
                title: template.title,
                description: template.description,
                choices: template.choices.map(function (choice) {
                    return {
                        text: choice.text,
                        effects: Object.assign({}, choice.effects)
                    };
                })
            };

            event.description = event.description.replace(/\[(.*?)\]/g, function (match, tag) {
                const bank = proceduralWordBanks[tag];
                if (!bank || bank.length === 0) {
                    return match;
                }
                const totalSize = bank.length + GENERATED_WORDS_PER_BANK;
                const randomIndex = Math.floor(Math.random() * totalSize);
                return getWordFromBank(bank, GENERATED_WORDS_PER_BANK, randomIndex);
            });

            return event;
        }

        function showNextProceduralEvent() {
            if (state.isDead) return;

            if (yearlyProceduralEventRemaining <= 0) {
                updateUI();
                return;
            }

            const event = generateProceduralEvent();
            const eventIndex = yearlyProceduralEventTotal - yearlyProceduralEventRemaining + 1;
            logEvent("Event - " + event.title + ": " + event.description);

            openModal(
                event.title + " (" + eventIndex + "/" + yearlyProceduralEventTotal + ")",
                event.description + " Your choice determines the outcome.",
                event.choices.map(function (choice) {
                    return {
                        label: choice.text + " (" + describeEffects(choice.effects) + ")",
                        handler: function () {
                            const died = applyProceduralEffects(choice.effects);
                            logEvent("Outcome - " + event.title + ": " + choice.text + " -> " + describeEffects(choice.effects));
                            yearlyProceduralEventRemaining -= 1;
                            closeModal();
                            if (died || state.isDead) return;
                            updateUI();
                            showNextProceduralEvent();
                        }
                    };
                })
            );
        }

        function triggerProceduralYearEvents() {
            yearlyProceduralEventTotal = Math.floor(Math.random() * 4);
            yearlyProceduralEventRemaining = yearlyProceduralEventTotal;

            if (yearlyProceduralEventTotal === 0) {
                logEvent("A quiet, uneventful year passes by...");
                updateUI();
                return;
            }

            logEvent("This year brought " + yearlyProceduralEventTotal + " surprise event" + (yearlyProceduralEventTotal > 1 ? "s." : "."));
            showNextProceduralEvent();
        }

        function applyActionWithRefresh(actionText, fn) {
            if (state.isDead) return;
            fn();
            logEvent(actionText);
            if (state.health <= 0) {
                onPlayerDeath();
                return;
            }
            updateUI();
            closeModal();
        }

        function getCureRecoveryAmount(disease) {
            const base = Math.max(2, disease.annualHealthDrain);
            const minRecovery = Math.max(2, Math.floor(base * 0.8));
            const maxRecovery = Math.max(minRecovery + 1, Math.floor(base * 2.4));
            return minRecovery + Math.floor(Math.random() * (maxRecovery - minRecovery + 1));
        }

        function getActiveIllnessSummary() {
            if (!state.currentIllnesses.length) return "No active illnesses.";
            return state.currentIllnesses.map(function (key) {
                const disease = DISEASES[key];
                if (!disease) return "";
                const status = disease.curable ? "Curable" : "Incurable";
                return disease.name + " (" + status + ", -" + disease.annualHealthDrain + " HP/yr)";
            }).filter(Boolean).join(" | ");
        }

        function processIllnessesForYear() {
            if (!state.currentIllnesses.length) return false;

            const healthAtStart = state.health;
            const yearlyDrainRecords = [];

            for (let i = 0; i < state.currentIllnesses.length; i++) {
                const key = state.currentIllnesses[i];
                const disease = DISEASES[key];
                if (!disease) continue;

                state.illnessYears[key] = (state.illnessYears[key] || 0) + 1;
                let healthDrain = disease.annualHealthDrain;

                if (key === "hiv") {
                    const years = state.illnessYears[key];
                    healthDrain += Math.floor((years - 1) / 3) * 2;
                }

                if (disease.conditionalTriggerChance && Math.random() > disease.conditionalTriggerChance) {
                    healthDrain = 0;
                }

                yearlyDrainRecords.push({ key: key, healthDrain: healthDrain });

                if (healthDrain > 0) {
                    state.health -= healthDrain;
                }
                if (disease.annualHappinessDrain) {
                    state.happiness -= disease.annualHappinessDrain;
                }
                if (disease.annualSmartsDrain) {
                    state.smarts -= disease.annualSmartsDrain;
                }

                logEvent(disease.name + " effect: -" + healthDrain + " HP this year.");
            }

            if (state.health <= 0) {
                let selectedDeathMessage = GENERIC_HEALTH_DEATH_MESSAGE;

                if (healthAtStart > 0) {
                    let runningHealth = healthAtStart;
                    let crossingIllnessKey = null;

                    for (let i = 0; i < yearlyDrainRecords.length; i++) {
                        const record = yearlyDrainRecords[i];
                        if (record.healthDrain <= 0) continue;
                        runningHealth -= record.healthDrain;
                        if (runningHealth <= 0) {
                            crossingIllnessKey = record.key;
                            break;
                        }
                    }

                    if (crossingIllnessKey && DISEASES[crossingIllnessKey] && DISEASES[crossingIllnessKey].deathMessage) {
                        selectedDeathMessage = DISEASES[crossingIllnessKey].deathMessage;
                    }
                }

                onPlayerDeath(selectedDeathMessage);
                return true;
            }

            return false;
        }

        function maybeContractDisease() {
            if (state.currentIllnesses.length >= 4) return;
            if (Math.random() >= 0.26) return;

            const available = ILLNESS_ROLL_TABLE.filter(function (entry) {
                return !state.currentIllnesses.includes(entry.key);
            });
            if (!available.length) return;

            const total = available.reduce(function (sum, entry) { return sum + entry.weight; }, 0);
            let roll = Math.random() * total;
            let selected = available[0].key;
            for (let i = 0; i < available.length; i++) {
                roll -= available[i].weight;
                if (roll <= 0) {
                    selected = available[i].key;
                    break;
                }
            }

            const disease = DISEASES[selected];
            state.currentIllnesses.push(selected);
            state.illnessYears[selected] = 0;
            state.happiness -= HAPPINESS_PENALTY_ON_DIAGNOSIS;

            if (disease.oneTimeHealthHit) {
                state.health -= disease.oneTimeHealthHit;
                logEvent("You were diagnosed with " + disease.name + ". Immediate health impact: -" + disease.oneTimeHealthHit + " HP.");
            } else {
                logEvent("You were diagnosed with " + disease.name + ". Happiness dropped slightly.");
            }
        }

        function openDoctorMenu() {
            if (!state.currentIllnesses.length) {
                openModal("Doctor", "No active illnesses. Stay healthy.", [
                    { label: "Close", handler: function () { closeModal(); } }
                ]);
                return;
            }

            const actions = state.currentIllnesses.map(function (key) {
                const disease = DISEASES[key];
                const status = disease.curable ? "Curable" : "Incurable";
                return {
                    label: disease.name + " (" + formatMoney(disease.cureCost) + ", " + status + ")",
                    handler: function () {
                        if (state.cash < disease.cureCost) {
                            logEvent("You couldn't afford treatment for " + disease.name + ".");
                            closeModal();
                            updateUI();
                            return;
                        }

                        state.cash -= disease.cureCost;
                        if (disease.curable) {
                            state.currentIllnesses = state.currentIllnesses.filter(function (illnessKey) {
                                return illnessKey !== key;
                            });
                            delete state.illnessYears[key];
                            const recovery = getCureRecoveryAmount(disease);
                            state.health += recovery;
                            logEvent("Doctor treated and cured " + disease.name + " for " + formatMoney(disease.cureCost) + ". Health recovered by +" + recovery + ".");
                        } else {
                            logEvent("Doctor visit for " + disease.name + " cost " + formatMoney(disease.cureCost) + ", but it remains incurable.");
                        }

                        closeModal();
                        updateUI();
                    }
                };
            });

            actions.push({ label: "Close", handler: function () { closeModal(); } });
            openModal("Doctor", "Active illnesses: " + getActiveIllnessSummary(), actions);
        }

        function openCareerMenu() {
            openModal("Career", "Push income higher, but your body and mind pay for it.", [
                {
                    label: "Work Overtime",
                    handler: function () {
                        applyActionWithRefresh("You worked overtime. Salary rose, but your health and happiness dropped.", function () {
                            state.salary *= 1.10;
                            state.health -= 10;
                            state.happiness -= 15;
                        });
                    }
                },
                {
                    label: "Ask for Raise",
                    handler: function () {
                        applyActionWithRefresh("You asked for a raise.", function () {
                            if (Math.random() < (state.smarts / 100)) {
                                state.salary *= 1.15;
                                logEvent("Your raise request succeeded.");
                            } else {
                                state.happiness -= 10;
                                logEvent("Your raise request was denied.");
                            }
                        });
                    }
                },
                {
                    label: "Close",
                    handler: function () {
                        closeModal();
                    }
                }
            ]);
        }

        function openActivitiesMenu() {
            openModal("Activities", "Spend resources to recover your life stats.", [
                {
                    label: "Therapy ($2k)",
                    handler: function () {
                        applyActionWithRefresh("You invested in therapy.", function () {
                            if (state.cash >= 2000) {
                                state.cash -= 2000;
                                state.happiness += 25;
                            } else {
                                state.happiness += 5;
                                logEvent("You couldn't afford a full session, but deciding to seek help still improved your mood.");
                            }
                        });
                    }
                },
                {
                    label: "Gym ($500)",
                    handler: function () {
                        applyActionWithRefresh("You spent time at the gym.", function () {
                            if (state.cash >= 500) {
                                state.cash -= 500;
                                state.health += 15;
                            } else {
                                logEvent("You couldn't afford the gym.");
                            }
                        });
                    }
                },
                {
                    label: "Read (Free)",
                    handler: function () {
                        applyActionWithRefresh("You read and learned something new.", function () {
                            state.smarts += 5;
                        });
                    }
                },
                {
                    label: "Visit Doctor",
                    handler: function () {
                        openDoctorMenu();
                    }
                },
                {
                    label: "Close",
                    handler: function () {
                        closeModal();
                    }
                }
            ]);
        }

        function openAssetsMenu() {
            if (state.cash <= 0) {
                openModal("Assets", "You cannot cash in assets when your cash balance is zero or negative.", [
                    {
                        label: "Close",
                        handler: function () {
                            closeModal();
                        }
                    }
                ]);
                return;
            }

            const currentNetWorth = state.cash + state.investments - state.debt;
            if (currentNetWorth <= 0) {
                openModal("Assets", "You cannot invest assets when your net worth is zero or negative.", [
                    {
                        label: "Close",
                        handler: function () {
                            closeModal();
                        }
                    }
                ]);
                return;
            }

            openModal("Assets", "Move money into investments and ride market volatility.", [
                {
                    label: "Invest 50% Cash",
                    handler: function () {
                        applyActionWithRefresh("You invested 50% cash, and your net worth dropped by 50%.", function () {
                            const amt = state.cash * 0.5;
                            state.cash -= amt;
                            state.investments += amt;
                            const netWorthBeforeDrop = state.cash + state.investments - state.debt;
                            const netWorthDrop = Math.abs(netWorthBeforeDrop) * 0.50;
                            state.cash -= netWorthDrop;
                        });
                    }
                },
                {
                    label: "Contribute 10% Cash",
                    handler: function () {
                        applyActionWithRefresh("You contributed 10% cash, and your net worth dropped by 10%.", function () {
                            const amt = state.cash * 0.10;
                            state.cash -= amt;
                            state.investments += amt;
                            const netWorthBeforeDrop = state.cash + state.investments - state.debt;
                            const netWorthDrop = Math.abs(netWorthBeforeDrop) * 0.10;
                            state.cash -= netWorthDrop;
                        });
                    }
                },
                {
                    label: "Close",
                    handler: function () {
                        closeModal();
                    }
                }
            ]);
        }

        function openRelationshipsMenu() {
            openModal("Relationships", "Invest in your connections to improve quality of life.", [
                {
                    label: "Date Night ($1.5k)",
                    handler: function () {
                        applyActionWithRefresh("You invested in a date night.", function () {
                            if (state.cash >= 1500) {
                                state.cash -= 1500;
                                state.happiness += 18;
                            } else {
                                logEvent("You couldn't afford date night.");
                            }
                        });
                    }
                },
                {
                    label: "Call Family (Free)",
                    handler: function () {
                        applyActionWithRefresh("You called family and recharged emotionally.", function () {
                            state.happiness += 10;
                        });
                    }
                },
                {
                    label: "Networking Event ($1k)",
                    handler: function () {
                        applyActionWithRefresh("You attended a networking event.", function () {
                            if (state.cash >= 1000) {
                                state.cash -= 1000;
                                state.salary *= 1.05;
                                state.happiness -= 4;
                            } else {
                                logEvent("You couldn't afford the networking event.");
                            }
                        });
                    }
                },
                {
                    label: "Close",
                    handler: function () {
                        closeModal();
                    }
                }
            ]);
        }

        function triggerRandomEvent() {
            const eventObj = randomEvents[Math.floor(Math.random() * randomEvents.length)];
            logEvent("Event - " + eventObj.name + ": " + eventObj.text);
            const actions = eventObj.choices.map(function (choice) {
                const unavailable = choice.requiresInvestments && state.investments <= 0;
                return {
                    label: unavailable
                        ? choice.label + " (Unavailable: no investments)"
                        : choice.label + " (" + choice.outcome + ")",
                    disabled: unavailable,
                    handler: function () {
                        if (unavailable) {
                            return;
                        }
                        choice.effect();
                        logEvent("Outcome - " + eventObj.name + ": " + choice.label + " -> " + choice.outcome);
                        if (state.health <= 0) {
                            closeModal();
                            onPlayerDeath();
                            return;
                        }
                        closeModal();
                        updateUI();
                    }
                };
            });
            openModal(eventObj.name, eventObj.text, actions);
        }

        function triggerDeath(customDeathMessage) {
            state.isDead = true;
            closeModal();
            gameUI.style.display = "none";
            deathScreen.style.display = "flex";

            const netWorth = state.cash + state.investments - state.debt;
            const causeMessage = customDeathMessage || GENERIC_HEALTH_DEATH_MESSAGE;
            deathSummary.textContent = causeMessage + " You died at Age " + state.age + ". Final Net Worth: " + formatMoney(netWorth) + ".";

            if (state.happiness > 80) {
                deathLifeNote.textContent = "You lived a deeply happy life.";
            } else if (state.happiness < 40) {
                deathLifeNote.textContent = "You died stressed and miserable.";
            } else {
                deathLifeNote.textContent = "A perfectly average life.";
            }
        }

        function onPlayerDeath(customDeathMessage) {
            deathSound.currentTime = 0;
            deathSound.play();
            triggerDeath(customDeathMessage);
            console.log("Player has died!");
        }

        function ageUp() {
            if (state.isDead || !state.major) return;

            state.age++;

            if (state.major === "finance") {
                state.health -= 5;
                state.happiness -= 10;
            } else if (state.major === "arts") {
                state.health -= 2;
                state.happiness -= 2;
                if (state.happiness > 85) {
                    state.salary *= 1.10;
                }
            } else if (state.major === "trades") {
                state.health -= 8;
                state.happiness -= 3;
            }

            let netIncome = state.salary * 0.75;

            state.debt *= 1.06;
            if (state.debt > 0) {
                let payment = netIncome * 0.15;
                state.debt -= payment;
                netIncome -= payment;
                if (state.debt < 0) {
                    state.debt = 0;
                }
            }

            state.cash += (netIncome - state.expenses);

            state.investments *= (1 + (Math.random() * 0.25 - 0.10));

            logEvent("Age " + state.age + ": You lived another year.");

            if (processIllnessesForYear()) {
                return;
            }
            maybeContractDisease();

            if (state.health <= 0) {
                onPlayerDeath();
                return;
            }

            triggerProceduralYearEvents();
        }

        function chooseMajor(major) {
            state.major = major;

            if (major === "finance") {
                state.debt = 60000;
                state.salary = 85000;
                state.smarts = 80;
            } else if (major === "arts") {
                state.debt = 40000;
                state.salary = 30000;
                state.smarts = 60;
            } else if (major === "trades") {
                state.debt = 5000;
                state.salary = 55000;
                state.smarts = 50;
            }

            setupScreen.style.display = "none";
            gameUI.style.display = "flex";

            logEvent("You chose " + major.charAt(0).toUpperCase() + major.slice(1) + ". Your adult life begins at age 18.");
            updateUI();
        }

        document.querySelectorAll(".major-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
                chooseMajor(btn.dataset.major);
            });
        });

        document.getElementById("age-up-btn").addEventListener("click", ageUp);
        document.getElementById("career-nav-btn").addEventListener("click", function () {
            if (!state.isDead && state.major) openCareerMenu();
        });
        document.getElementById("activities-nav-btn").addEventListener("click", function () {
            if (!state.isDead && state.major) openActivitiesMenu();
        });
        document.getElementById("assets-nav-btn").addEventListener("click", function () {
            if (!state.isDead && state.major) openAssetsMenu();
        });
        document.getElementById("relationships-nav-btn").addEventListener("click", function () {
            if (!state.isDead && state.major) openRelationshipsMenu();
        });
        document.getElementById("play-again-btn").addEventListener("click", function () {
            location.reload();
        });

        modalOverlay.addEventListener("click", function (event) {
            if (event.target === modalOverlay) {
                closeModal();
            }
        });

        introLogo.addEventListener("animationend", function () {
            introScreen.style.display = "none";
            setupScreen.style.display = "flex";
            requestAnimationFrame(function () {
                setupScreen.style.opacity = "1";
            });
        }, { once: true });
    </script>
</body>
</html>
