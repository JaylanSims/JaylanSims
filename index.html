            padding: 0;

        #app-container {
            background-color: #121212;
            color: #E0E0E0;
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #intro-logo {
            max-width: 300px;
            width: 80%;
            animation: slideAndFade 4s ease-in-out forwards;
        }

        @keyframes slideAndFade {
            0% {
                transform: translateY(100vh);
                opacity: 1;
            }
            30% {
                transform: translateY(0);
                opacity: 1;
            }
            70% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(0);
                opacity: 0;
            }

            flex: 1;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            gap: 16px;
            text-align: center;
            opacity: 0;
            transition: opacity 1s ease-in;

            margin: 0;
            font-size: 1.8rem;
            line-height: 1.2;
        }

        .subtitle {

            color: #bdbdbd;
            font-size: 0.95rem;

            border-radius: 12px;

            font-size: 0.95rem;
            line-height: 1.35;

            display: block;
            margin-bottom: 4px;
            font-size: 1.05rem;
        }

        .major-btn:active {
            transform: scale(0.99);
        }

            height: 100%;

            border-bottom: 1px solid #333;
            display: flex;

            gap: 6px;
            padding: 8px 6px;

            align-items: stretch;

            overflow: hidden;

            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;

        function generatePromotion(currentTitle, currentSalary, currentLevel, track) {
            var baseTitle = stripPromotionPrefixesFromTitle(currentTitle);
            var nextLevel = currentLevel + 1;
            var newTitle = "";
            var mult = 1;
            if (currentLevel === 1) {
                newTitle = "Senior " + baseTitle;
                mult = 1.30;
            } else if (currentLevel === 2) {
                newTitle = track === "Trades" ? "Master " + baseTitle : "Lead " + baseTitle;
                mult = 1.35;
            } else if (currentLevel === 3) {
                newTitle = track === "Trades" ? baseTitle + " Business Owner" : "Director of " + baseTitle;
                mult = 1.50;
            } else {
                return null;

            return {
                newTitle: newTitle,
                newSalary: Math.round(currentSalary * mult),
                level: nextLevel
            };
        }

        function startExamYearQuestionQueue(path) {
            const bank = EXAM_QUESTION_BANKS[path] || [];
            if (bank.length < 1) {
                state.examYearQuestionQueue = [];
                return;
            }
            var indices = bank.map(function (_, i) { return i; });
            for (var i = indices.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = indices[i];
                indices[i] = indices[j];
                indices[j] = t;
            }
            var pick = [];
            for (var k = 0; k < indices.length && pick.length < 1; k++) {
                var idx = indices[k];
                var id = examQuestionId(path, idx);
                if (state.examYearUsedQuestionIds.indexOf(id) === -1) {
                    pick.push(idx);
                }
            }
            if (pick.length < 1) {
                state.examYearUsedQuestionIds = [];
                pick = indices.slice(0, 1);
            }
            pick.forEach(function (idx) {
                state.examYearUsedQuestionIds.push(examQuestionId(path, idx));
            });
            state.examYearQuestionQueue = pick.map(function (idx) {
                var q = bank[idx];
                return {
                    question: q.question,
                    options: q.options.slice(),
                    correctAnswerIndex: q.correctAnswerIndex
                };
            });
        }

        function popNextExamQuestionForYear() {
            if (!state.examYearQuestionQueue || !state.examYearQuestionQueue.length) return null;
            return state.examYearQuestionQueue.shift();

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function DiagnosisOverlay(props) {
            const disease = DISEASES[props.illnessKey];
            if (!disease) return "";
            const isMental = isMentalIllness(props.illnessKey);
            const tier = disease.mentalTier || null;
            const tierColor = tier === "severe" ? "#ff5252" : tier === "medium" ? "#FFD700" : "#69f0ae";
            const tierLabel = tier ? (" <span style=\"color:" + tierColor + ";font-weight:700\">(" + tier.toUpperCase() + ")</span>") : "";
            const drainDesc = isMental
                ? "Annual drain: -" + (disease.annualHappinessDrain || 0) + " Happiness/yr" + (disease.mentalCurable === false ? " | Incurable" : " | Treatable with Psychiatrist")
                : "Annual drain: -" + (disease.annualHealthDrain || 0) + " Health/yr" + (disease.curable ? " | Curable" : " | Incurable");
            const doctorBtnAttrs = props.canAccessDoctor ? "" : "disabled";
            const doctorLabel = props.canAccessDoctor
                ? (isMental ? "Go to Psychiatrist →" : "Go to the Doctor →")
                : (isMental ? "Psychiatrist (Unavailable)" : "Doctor (Unavailable)");
            return "<div id=\"diagnosis-overlay\" class=\"open\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Medical Diagnosis\">" +
                "<div id=\"diagnosis-card\">" +
                "<h2 id=\"diagnosis-title\">NEW DIAGNOSIS" + (isMental ? " — MENTAL HEALTH" : "") + "</h2>" +
                "<p id=\"diagnosis-text\">You have been diagnosed with <strong>" + escapeHtml(disease.name) + "</strong>" + tierLabel + ".</p>" +
                "<p id=\"diagnosis-cost\" style=\"color:#bdbdbd;font-size:0.88rem;\">" + drainDesc + "<br>Base treatment cost: " + formatMoney(disease.cureCost) + (isMental ? " per psychiatrist visit" : "") + "</p>" +
                "<div id=\"diagnosis-actions\">" +
                "<button class=\"diagnosis-btn\" id=\"diagnosis-okay-btn\">Okay</button>" +
                "<button class=\"diagnosis-btn\" id=\"diagnosis-doctor-btn\" " + doctorBtnAttrs + ">" + doctorLabel + "</button>" +
                "</div>" +
                "</div>" +
                "</div>";
        }

        function renderDiagnosisOverlay() {
            if (!state.isDiagnosisOverlayOpen || !state.currentDiagnosisIllnessKey) {
                diagnosisOverlayRoot.innerHTML = "";
                return;
            }

            diagnosisOverlayRoot.innerHTML = DiagnosisOverlay({
                illnessKey: state.currentDiagnosisIllnessKey,
                canAccessDoctor: state.canAccessDoctor
            });

            const okayBtn = document.getElementById("diagnosis-okay-btn");
            const doctorBtn = document.getElementById("diagnosis-doctor-btn");

            if (okayBtn) {
                okayBtn.addEventListener("click", function () {
                    closeDiagnosisOverlay();
                });
            }
            if (doctorBtn && state.canAccessDoctor) {
                doctorBtn.addEventListener("click", function () {
                    const diagnosisKey = state.currentDiagnosisIllnessKey;
                    closeDiagnosisOverlay();
                    if (isMentalIllness(diagnosisKey)) {
                        openPsychiatristFromOverlay();
                    } else {
                        openDoctorComponent();
                    }
                });

        }

        function applyMentalDefaultsForIllness(illnessKey, disease) {
            if (!isMentalIllness(illnessKey)) return;
            if (!state.mentalIllnessState[illnessKey]) {
                let requiredVisits = 0;
                if (disease.mentalCurable && typeof disease.mentalMinVisits === "number" && typeof disease.mentalMaxVisits === "number") {
                    requiredVisits = randomIntBetween(disease.mentalMinVisits, disease.mentalMaxVisits);
                }
                state.mentalIllnessState[illnessKey] = {
                    isSuppressed: false,
                    requiredVisitsRemaining: requiredVisits
                };
            } else {
                state.mentalIllnessState[illnessKey].isSuppressed = false;
            }
        }

        function closeDiagnosisOverlay() {
            state.isDiagnosisOverlayOpen = false;
            state.currentDiagnosisIllnessKey = null;
            diagnosisOverlayRoot.innerHTML = "";
        }

        function openDiagnosisOverlayForIllness(illnessKey) {
            if (!DISEASES[illnessKey]) return;
            closeModal();
            state.isDiagnosisOverlayOpen = true;
            state.currentDiagnosisIllnessKey = illnessKey;
            renderDiagnosisOverlay();
        }

        function openDoctorComponent() {
            state.activeView = "DoctorComponent";
            openDoctorMenu();
        }

        function openPsychiatristFromOverlay() {
            state.activeView = "PsychiatristService";
            openAssetsMenu(true);
        }

        function diagnoseIllness(illnessKey, options) {
            const disease = DISEASES[illnessKey];
            const config = options || {};
            if (!disease) return false;

            const alreadyHasIllness = state.currentIllnesses.includes(illnessKey);
            if (!alreadyHasIllness) {
                if (state.currentIllnesses.length >= 4) return false;
                state.currentIllnesses.push(illnessKey);
                state.illnessYears[illnessKey] = 0;
                applyMentalDefaultsForIllness(illnessKey, disease);
            }

            if (config.setHappinessZero) {
                state.happiness = 0;
            } else if (!config.skipHappinessPenalty && !alreadyHasIllness) {
                state.happiness -= HAPPINESS_PENALTY_ON_DIAGNOSIS;
            }

            if (disease.oneTimeHealthHit && !alreadyHasIllness) {
                state.health -= disease.oneTimeHealthHit;
                logEvent("You were diagnosed with " + disease.name + ". Immediate health impact: -" + disease.oneTimeHealthHit + " HP.");
            } else if (!alreadyHasIllness) {
                logEvent("You were diagnosed with " + disease.name + ".");
            }

            if (state.health <= 0) {
                onPlayerDeath(disease.deathMessage || GENERIC_HEALTH_DEATH_MESSAGE);
                return true;
            }

            if (!alreadyHasIllness || config.forceOverlay) {
                openDiagnosisOverlayForIllness(illnessKey);
            }
            return true;
        }

        function visitPsychiatrist() {
            closeDiagnosisOverlay();
            if (state.cash < PSYCHIATRIST_VISIT_COST) {
                logEvent("You couldn't afford a psychiatrist visit.");
                closeModal();
                updateUI();
                return;
            }

            const activeMentalIllnesses = state.currentIllnesses.filter(function (key) { return isMentalIllness(key); });
            if (!activeMentalIllnesses.length) {
                logEvent("You attended psychiatry, but had no active mental illnesses to treat.");
                closeModal();
                updateUI();
                return;
            }

            state.cash -= PSYCHIATRIST_VISIT_COST;
            const cured = [];
            let visitProgressMade = false;

            activeMentalIllnesses.forEach(function (illnessKey) {
                const disease = DISEASES[illnessKey];
                applyMentalDefaultsForIllness(illnessKey, disease);
                const mentalState = state.mentalIllnessState[illnessKey];
                mentalState.isSuppressed = true;

                if (disease.mentalCurable && mentalState.requiredVisitsRemaining > 0) {
                    mentalState.requiredVisitsRemaining -= 1;
                    visitProgressMade = true;
                    if (mentalState.requiredVisitsRemaining <= 0) {
                        cured.push(illnessKey);
                    }
                }
            });

            if (cured.length) {
                state.currentIllnesses = state.currentIllnesses.filter(function (key) {
                    return !cured.includes(key);
                });
                cured.forEach(function (illnessKey) {
                    delete state.illnessYears[illnessKey];
                    delete state.mentalIllnessState[illnessKey];
                });
                logEvent("Psychiatry sessions resolved: " + cured.map(function (key) { return DISEASES[key].name; }).join(", ") + ".");
            } else {
                logEvent("You visited the psychiatrist. Mental illness symptoms were suppressed this year." + (visitProgressMade ? " You are making treatment progress." : ""));
            }

            closeModal();
            updateUI();
        }

        function applyAnnualMentalHealthLogic() {
            const activeMentalIllnesses = state.currentIllnesses.filter(function (key) {
                return isMentalIllness(key);
            });
            if (!activeMentalIllnesses.length) {
                if (state.happiness > 80) {
                    state.happiness += 5;
                    logEvent("Mental Clarity: with no active mental illnesses, you gained +5 Happiness.");
                }
                return;
            }

            let hadUnsuppressedAtZero = false;
            let highestTier = "mild";

            activeMentalIllnesses.forEach(function (illnessKey) {
                const disease = DISEASES[illnessKey];
                applyMentalDefaultsForIllness(illnessKey, disease);
                const mentalState = state.mentalIllnessState[illnessKey];
                const tier = disease.mentalTier || "mild";
                if (getMentalTierIndex(tier) > getMentalTierIndex(highestTier)) {
                    highestTier = tier;
                }

                const baseDrain = MENTAL_TIER_HAPPINESS_DRAIN[tier] || 10;
                const appliedDrain = mentalState.isSuppressed
                    ? Math.round(baseDrain * MENTAL_HEALTH_SUPPRESSION_FACTOR)
                    : baseDrain;

                state.happiness -= appliedDrain;
                logEvent(disease.name + " mental strain: -" + appliedDrain + " Happiness this year" + (mentalState.isSuppressed ? " (suppressed)." : "."));
                if (!mentalState.isSuppressed && state.happiness <= 0) {
                    hadUnsuppressedAtZero = true;
                }
            });

            if (hadUnsuppressedAtZero && Math.random() < 0.5) {
                const currentTierIndex = getMentalTierIndex(highestTier);
                const worseningTier = MENTAL_TIER_ORDER[Math.min(MENTAL_TIER_ORDER.length - 1, currentTierIndex + 1)];
                const worseningIllness = getRandomMentalIllnessKey({ minTier: worseningTier, maxTier: "severe", excludeActive: true });
                if (worseningIllness) {
                    diagnoseIllness(worseningIllness, { skipHappinessPenalty: true, forceOverlay: true });
                    logEvent("Mental health worsened due to neglect.");
                }
            }
        }

        function maybeTriggerPathBasedMentalDiagnosis() {
            const hasDebtPressure = state.cash < 0 || state.debt > 0;
            const isJobLossScenario = state.jobTitle !== "Student" && state.jobTitle !== "Unemployed" && state.annualIncome <= 0;
            const hasAcademicFailure = state.academicDismissed;
            if (!hasDebtPressure && !isJobLossScenario && !hasAcademicFailure) {
                return;
            }

            const baselineChance = 0.18;
            const chance = baselineChance * getMentalRiskMultiplier();
            if (Math.random() >= chance) return;

            const key = getRandomMentalIllnessKey({ excludeActive: true });
            if (key) {
                diagnoseIllness(key, { forceOverlay: true });
            }
        }

        function handleSuicideDeath() {
            triggerDeath(SUICIDE_DEATH_MESSAGE, "suicide");
        }

        function maybeTriggerDepressionFromLowStats() {
            if (state.currentIllnesses.includes("depression")) return false;
            if (state.happiness > 0) return false;
            return diagnoseIllness("depression", { setHappinessZero: true, skipHappinessPenalty: true });
        }

        function getRequiredExamPassesForProgram(program) {
            var totalQuestions = program.yearsRequired * 1;
            if (program && program.pipeline && program.pipeline !== "undergrad") {
                return Math.ceil(totalQuestions * 0.5);
            }
            if (program.yearsRequired >= 4) {
                return 3;
            }
            return Math.ceil(totalQuestions * 0.75);
        }

        function clearEnrollmentAfterDismissalOrQuit() {
            state.currentlyPursuing = null;
            state.yearsInSchool = 0;
            state.examsPassedThisDegree = 0;
            state.examsTakenThisDegree = 0;
            state.examYearQuestionQueue = [];
            state.examYearUsedQuestionIds = [];
            state.examQuestionsThisYearTotal = 0;
            state.examQuestionsThisYearAnswered = 0;
            state.isInSchool = false;
            state.isEnrolled = false;
            state.isExamModalOpen = false;
            state.isExamActive = false;
            state.currentExamQuestion = null;
            syncCurrentEnrollment();
            evictDormIfNotEnrolled(false);
        }

        function handleAdvancedAcademicDismissal(program, requiredPasses) {
            const passedCount = state.examsPassedThisDegree;
            const debtLine = "You have finished your studies with " + formatMoney(state.existingDebt) + " in student debt.";
            logEvent("Academic dismissal: failed to meet exam threshold for " + program.degreeName + ". No degree awarded; tuition debt remains.");
            clearEnrollmentAfterDismissalOrQuit();
            state._savedJobBeforeSchoolYear = null;
            state.jobSearchBlocked = false;
            academicDismissalBody.innerHTML =
                "<p class=\"dismissal-score\">You passed " + passedCount + " out of " + program.yearsRequired + " exams (required: " + requiredPasses + ").</p>" +
                "<p>You did not pass the required threshold for <strong>" + program.degreeName + "</strong>. No degree awarded. You may attempt other programs.</p>" +
                "<p style=\"color:#bdbdbd; font-size:0.88rem;\">" + debtLine + "</p>";
            academicDismissalAckBtn.textContent = "Understood. Continue.";
            academicDismissalAckBtn.onclick = function () {
                state.isAcademicDismissalOverlayOpen = false;
                closeAcademicDismissalOverlay();
                academicDismissalAckBtn.textContent = "I understand. Re-enroll from Year 1.";
                academicDismissalAckBtn.onclick = null;
                updateUI();
            };
            state.isAcademicDismissalOverlayOpen = true;
            academicDismissalOverlay.classList.add("open");
            academicDismissalOverlay.setAttribute("aria-hidden", "false");
            updateUI();
        }

        function handleAcademicDismissal(program, requiredPasses) {
            const passedCount = state.examsPassedThisDegree;

            if (program && program.pipeline && program.pipeline !== "undergrad") {
                handleAdvancedAcademicDismissal(program, requiredPasses);
                return;
            }

            applyDegreeEndDebt();
            state.degreeWrongAnswersThisEnrollment = 0;
            const debtLine = "Total student debt: " + formatMoney(state.existingDebt) + ".";

            state.academicDismissed = true;
            state.jobSearchBlocked = true;
            state.yearsInSchool = 0;
            state.examsPassedThisDegree = 0;
            state.examsTakenThisDegree = 0;
            state.isInSchool = true;
            state.isEnrolled = true;
            syncCurrentEnrollment();

            logEvent("Academic dismissal: failed graduation exam requirement for " + program.degreeName + ". Must restart from Year 1.");
            state.examYearQuestionQueue = [];
            state.examYearUsedQuestionIds = [];
            state.examQuestionsThisYearTotal = 0;
            state.examQuestionsThisYearAnswered = 0;

            triggerAcademicDismissalOverlay(passedCount, program.yearsRequired, requiredPasses, program.degreeName, debtLine);
            updateUI();
        }

        function finalizeSchoolYearAfterExams() {
            const program = state.currentlyPursuing ? EDUCATION_PROGRAMS[state.currentlyPursuing] : null;
            if (!program) return;

            const savedJob = state._savedJobBeforeSchoolYear;

            state.age += 1;
            state.yearsInSchool += 1;

            if (program.pipeline === "residency") {
                state.jobTitle = "Medical Resident";
                state.annualIncome = typeof program.residencyStipend === "number" ? program.residencyStipend : 45000;
                state.salary = state.annualIncome;
                state.isEmployed = true;
                state._savedJobBeforeSchoolYear = null;
                const stipendNet = state.annualIncome * 0.75;
                state.cash += stipendNet;
                logEvent("Residency stipend (after tax): +" + formatMoney(stipendNet) + ".");
            } else if (program.pipeline !== "undergrad" && savedJob && savedJob.isEmployed) {
                state.jobTitle = savedJob.jobTitle;
                state.annualIncome = savedJob.annualIncome;
                state.salary = savedJob.salary;
                state.isEmployed = true;
                state._savedJobBeforeSchoolYear = null;
                const netIncome = state.annualIncome * 0.75;
                state.cash += netIncome;
                logEvent("Dual hustle: work income while studying: +" + formatMoney(netIncome) + " after taxes.");
            } else {
                state.annualIncome = 0;
                state.salary = 0;
                state.jobTitle = "Student";
                state.isEmployed = false;
            }

            if (program.pipeline !== "residency") {
                applyDualHustleStressForYear();
            }

            state.smarts += 2;
            state.happiness -= 1;
            state.health -= 1;

            applyAdvancedTuitionDebt(program);

            maybeTriggerDualHustleBurnout();

            if (state.yearsInSchool >= 1) {
                state.hudDebtSalaryUnlocked = true;
            }

            syncCurrentEnrollment();

            logEvent(
                "Age " + state.age + ": Completed final exam for Year " + state.yearsInSchool + "/" + program.yearsRequired +
                " in " + program.degreeName + ". Total passed: " + state.examsPassedThisDegree + "/" + state.yearsInSchool + "."
            );

            state.examQuestionsThisYearTotal = 0;
            state.examQuestionsThisYearAnswered = 0;

            syncFinancialAliases();
            if (state.health <= 0) {
                onPlayerDeath(GENERIC_HEALTH_DEATH_MESSAGE);
                return;
            }

            if (state.yearsInSchool >= program.yearsRequired) {
                const requiredPasses = getRequiredExamPassesForProgram(program);
                if (state.examsPassedThisDegree >= requiredPasses) {
                    completeProgram(state.currentlyPursuing);
                } else {
                    handleAcademicDismissal(program, requiredPasses);
                }
                return;
            }

            updateUI();
        }

        function handleYearlyExamAnswer(selectedOptionIndex) {
            if (!state.isExamModalOpen || !state.currentExamQuestion) return;

            const answerWasCorrect = selectedOptionIndex === state.currentExamQuestion.correctAnswerIndex;
            state.examsTakenThisDegree += 1;
            if (answerWasCorrect) {
                state.examsPassedThisDegree += 1;
            } else {
                state.degreeWrongAnswersThisEnrollment += 1;
                if (state.playerPath === "STEM") {
                    state.existingDebt += STEM_WRONG_ANSWER_PENALTY;
                }
            }

            syncFinancialAliases();
            updateUI();
            renderYearlyExamOverlay(selectedOptionIndex, true);

            window.setTimeout(function () {
                state.examQuestionsThisYearAnswered += 1;
                var nextQ = popNextExamQuestionForYear();
                if (nextQ) {
                    state.currentExamQuestion = nextQ;
                    state.isExamModalOpen = true;
                    state.isExamActive = true;
                    renderYearlyExamOverlay(null, false);
                } else {
                    closeYearlyExamOverlay();
                    finalizeSchoolYearAfterExams();
                }
            }, EXAM_FEEDBACK_DELAY_MS);
        }

        function openYearlyExamOverlay() {
            if (state.isDead || !state.currentlyPursuing || state.isExamModalOpen) return;

            startExamYearQuestionQueue(state.playerPath);
            var first = popNextExamQuestionForYear();
            if (!first) {
                finalizeSchoolYearAfterExams();
                return;
            }

            closeModal();
            state.examQuestionsThisYearTotal = 1;
            state.examQuestionsThisYearAnswered = 0;
            state.isExamModalOpen = true;
            state.currentExamQuestion = first;
            renderYearlyExamOverlay(null, false);
        }

        function addCredential(credential) {
            if (!state.educationCredentials.includes(credential)) {
                state.educationCredentials.push(credential);
            }
        }

        function meetsEducationRequirement(requiredEducation) {
            if (requiredEducation === "None") {
                return true;
            }
            const creds = state.educationCredentials;
            if (requiredEducation === "Trade Certificate") {
                return creds.includes("Trade Certificate");
            }
            if (requiredEducation === "Bachelor's Degree") {
                return creds.includes("Bachelor's Degree") || creds.includes("Master's Degree") || creds.includes("Medical Degree") || creds.includes("Law Degree") || creds.includes("Doctorate");
            }
            if (requiredEducation === "Master's Degree") {
                return creds.includes("Master's Degree") || creds.includes("Medical Degree") || creds.includes("Doctorate");
            }
            if (requiredEducation === "Medical Degree") {
                return creds.includes("Medical Degree") || creds.includes("Doctorate");
            }
            if (requiredEducation === "Medical Degree/Doctorate") {
                return creds.includes("MedicalDegree") || creds.includes("Medical Degree") || creds.includes("Doctorate");
            }
            if (requiredEducation === "Law Degree") {
                return creds.includes("Law Degree");
            }
            return state.educationLevel === requiredEducation;
        }

        function getHireChance() {
            if (state.playerPath === "Trades") {
                return 0.85;
            }
            if (state.playerPath === "STEM") {
                return 0.60;
            }
            return 0.20;
        }

        function quitJob() {
            const prog = state.currentlyPursuing ? EDUCATION_PROGRAMS[state.currentlyPursuing] : null;
            if (prog && prog.pipeline === "residency") {
                logEvent("You cannot quit during Medical Residency.");
                return;

            state.jobTitle = "Unemployed";

            state.salary = 0;
            state.isEmployed = false;
            state.jobType = "None";

            state.currentJobLevel = 1;
            state.pendingPromotion = null;

                promotionOverlayReactRoot.render(null);
            }

            updateUI();
        }

            if (!resignationOverlay || !resignationText) return;

                "Are you sure you want to quit your position as a " + state.jobTitle +

        function applyForJob(job) {
            const isOddJob = job.jobKind === "OddJob";
            const chance = isOddJob ? 0.95 : getHireChance();
            if (Math.random() < chance) {
                state.annualIncome = job.salary;
                state.jobTitle = job.title;
                state.salary = job.salary;
                state.isEmployed = true;
                state.jobType = isOddJob ? "OddJob" : "Career";
                state.yearsAtCurrentJob = 0;
                state.currentJobLevel = 1;
                state.pendingPromotion = null;
                state.isPromotionOverlayOpen = false;
                if (promotionOverlayReactRoot) {
                    promotionOverlayReactRoot.render(null);
                }
                state.hudDebtSalaryUnlocked = true;
                logEvent("Hired! You are now a " + job.title + " earning " + formatMoney(job.salary) + "/yr.");
                showPurchaseToastMessage("Hired as " + job.title + " — " + formatMoney(job.salary) + "/yr!");
            } else {
                logEvent("Application rejected for " + job.title + ". The " + (state.playerPath === "Humanities" ? "Arts job market is tough (20% chance)" : "job market is competitive") + ". Try again.");
                showPurchaseToastMessage("Application rejected for " + job.title + ". Keep trying!");
            }
            closeModal();
            updateUI();
        }

        function openJobBoard() {
            const enrProg = state.currentlyPursuing ? EDUCATION_PROGRAMS[state.currentlyPursuing] : null;
            if (enrProg && enrProg.pipeline === "residency") {
                openModal("Career Path Jobs", "You cannot take a standard job during Medical Residency.", [
                    { label: "Close", handler: function () { closeModal(); } }
                ]);
                return;
            }
            if (state.isEmployed) {
                openModal("Career Path Jobs", "You already have a job. Use Quit Job in Careers if you want to apply elsewhere.", [
                    { label: "Close", handler: function () { closeModal(); } }
                ]);
                return;
            }
            if (state.currentlyPursuing) {
                openModal("Career Path Jobs", "Degree-track careers unlock after you graduate. Use Odd Jobs & Part-Time while in school.", [
                    { label: "Close", handler: function () { closeModal(); } }
                ]);
                return;
            }
            if (state.jobSearchBlocked) {
                openModal("Career Path Jobs", "Career applications are locked until you resolve academic dismissal and graduate.", [
                    { label: "Close", handler: function () { closeModal(); } }
                ]);
                return;
            }
            const hireChancePct = state.playerPath === "Trades" ? "85%" : state.playerPath === "STEM" ? "60%" : "20%";
            const pathNote = state.playerPath === "Humanities"
                ? "<span style=\"color:#ff8a80\">Arts path: Hard Mode — only 20% hire rate per application.</span>"
                : state.playerPath === "STEM"
                    ? "<span style=\"color:#FFD700\">STEM path: 60% hire rate per application.</span>"
                    : "<span style=\"color:#69f0ae\">Trades path: 85% hire rate per application.</span>";
            const jobs = JOB_MARKET[state.playerPath] || [];
            const actions = jobs.map(function (job) {
                const eligible = meetsEducationRequirement(job.requiredEducation);
                return {
                    label: eligible
                        ? "Apply (" + hireChancePct + "): " + job.title + " — " + formatMoney(job.salary) + "/yr"
                        : job.title + " — Requires " + job.requiredEducation,
                    disabled: !eligible,
                    handler: function () {
                        if (!eligible) return;
                        applyForJob(job);
                    }
                };
            });
            actions.push({ label: "Close", handler: function () { closeModal(); } });
            openModal("Find a Job — " + state.playerPath + " Careers", pathNote + "<br>Professional roles filtered to your " + state.playerPath + " credential.", actions);
        }

        function openOddJobsBoard() {
            const enrProg = state.currentlyPursuing ? EDUCATION_PROGRAMS[state.currentlyPursuing] : null;
            if (enrProg && enrProg.pipeline === "residency") {
                openModal("Odd Jobs & Part-Time", "No side jobs during Medical Residency.", [
                    { label: "Close", handler: function () { closeModal(); } }
                ]);
                return;
            }
            if (state.isEmployed) {
                openModal("Odd Jobs & Part-Time", "Quit your current job first to apply for a different one.", [
                    { label: "Close", handler: function () { closeModal(); } }
                ]);
                return;
            }
            const jobs = getOddJobsListForPlayer();
            const actions = jobs.map(function (job) {
                return {
                    label: "Apply: " + job.title + " — " + formatMoney(job.salary) + " (~95% hire)",
                    handler: function () {
                        applyForJob(job);
                    }
                };
            });
            actions.push({ label: "Close", handler: function () { closeModal(); } });
            openModal(
                "Odd Jobs & Part-Time",
                "No degree required. General listings plus " + state.playerPath + "-themed work. Easy to get hired; lighter stress if you study at the same time.",
                actions
            );
        }

        function openCareersTab() {
            const enrProg = state.currentlyPursuing ? EDUCATION_PROGRAMS[state.currentlyPursuing] : null;
            const residencyBlock = enrProg && enrProg.pipeline === "residency";
            const canCareerBoard = !state.isEmployed && !state.currentlyPursuing && !state.jobSearchBlocked && !residencyBlock;
            const canOddJobsBoard = !state.isEmployed && state.playerPath && !residencyBlock;

            var hireRateInfo = state.playerPath === "Trades"
                ? "<span style=\"color:#69f0ae\">Hire Rate: 85% — Trades are in demand</span>"
                : state.playerPath === "STEM"
                    ? "<span style=\"color:#FFD700\">Hire Rate: 60% — Competitive market</span>"
                    : "<span style=\"color:#ff8a80\">Hire Rate: 20% — Arts: Hard Mode</span>";

            var lockReason = "";
            if (state.jobSearchBlocked) {
                lockReason = "<br><span style=\"color:#ff8a80;\">Career locked: resolve academic dismissal first.</span>";
            } else if (state.currentlyPursuing) {
                lockReason = "<br><span style=\"color:#bdbdbd;\">Career locked while enrolled in school.</span>";
            } else if (residencyBlock) {
                lockReason = "<br><span style=\"color:#bdbdbd;\">Career locked during Medical Residency.</span>";
            }

            if (state.isEmployed) {
                const typeLabel = state.jobType === "OddJob" ? "Part-time / Odd Job" : state.jobType === "Career" ? "Career" : "Other";
                const panel =
                    "<strong>Active Employment</strong><br><br>" +
                    "Type: " + typeLabel + "<br>" +
                    "Position: " + state.jobTitle + "<br>" +
                    "Annual Salary: " + formatMoney(state.annualIncome) + "<br>" +
                    "Years at Job: " + state.yearsAtCurrentJob + "<br><br>" +
                    "<span style=\"color:#bdbdbd;font-size:0.9rem;\">Promotions available after 3 years. Use Quit Job if you want to look elsewhere.</span>";
                openModal(
                    "Careers",
                    panel,
                    [
                        { label: "Close", handler: function () { closeModal(); } },
                        { label: "Quit Job", handler: function () { openResignationConfirm(); } }
                    ]
                );
                return;
            }

            const credLabel = state.educationLevel !== "None" ? state.educationLevel : "No degree yet";
            openModal(
                "Careers",
                "Status: <strong>" + state.jobTitle + "</strong> | Credential: " + credLabel + "<br>" +
                hireRateInfo + lockReason +
                "<br><br><strong>Choose a job board:</strong>",
                [
                    {
                        label: canCareerBoard ? "Find a Job (Career — Requires Degree)" : "Find a Job (Locked — Need Degree)",
                        disabled: !canCareerBoard,
                        handler: function () {
                            if (canCareerBoard) openJobBoard();
                        }
                    },
                    {
                        label: canOddJobsBoard ? "Odd Jobs & Part-Time (No Degree Required)" : "Odd Jobs (Unavailable)",
                        disabled: !canOddJobsBoard,
                        handler: function () {
                            if (canOddJobsBoard) openOddJobsBoard();
                        }
                    },
                    { label: "Close", handler: function () { closeModal(); } }
                ]
            );
        }

        function enrollInProgram(programKey) {
            const program = EDUCATION_PROGRAMS[programKey];
            if (!program) return;
            if (!programPrerequisitesMet(program)) {
                logEvent("Enrollment blocked: prerequisites not met for " + program.degreeName + ".");
                return;
            }
            state.currentlyPursuing = programKey;
            state.yearsInSchool = 0;
            state.examsPassedThisDegree = 0;
            state.examsTakenThisDegree = 0;
            state.degreeWrongAnswersThisEnrollment = 0;
            state.currentExamQuestion = null;
            state.isExamModalOpen = false;
            state.isExamActive = false;
            state.examYearQuestionQueue = [];
            state.examYearUsedQuestionIds = [];
            state.examQuestionsThisYearTotal = 0;
            state.examQuestionsThisYearAnswered = 0;
            state.isInSchool = true;
            state.isEnrolled = true;
            state.jobSearchBlocked = program.pipeline === "undergrad" || program.pipeline === "residency";
            state._savedJobBeforeSchoolYear = null;

            if (program.pipeline === "undergrad" && state.playerPath === "STEM") {
                state.existingDebt += STEM_BASE_TUITION;
            }

            if (program.pipeline === "residency") {
                state.jobTitle = "Medical Resident";
                state.annualIncome = typeof program.residencyStipend === "number" ? program.residencyStipend : 45000;
                state.salary = state.annualIncome;
                state.isEmployed = true;
                state.jobType = "Career";
            } else if (program.pipeline === "undergrad" && state.isEmployed && state.jobType === "OddJob") {
                state._savedJobBeforeSchoolYear = {
                    jobTitle: state.jobTitle,
                    annualIncome: state.annualIncome,
                    salary: state.salary,
                    isEmployed: true,
                    jobType: "OddJob"
                };
                state.jobTitle = "Student";
                state.annualIncome = 0;
                state.salary = 0;
                state.isEmployed = false;
                state.jobType = "None";
            } else if (program.pipeline !== "undergrad" && state.isEmployed) {
                state._savedJobBeforeSchoolYear = {
                    jobTitle: state.jobTitle,
                    annualIncome: state.annualIncome,
                    salary: state.salary,
                    isEmployed: true,
                    jobType: state.jobType
                };
                state.jobTitle = "Student";
                state.annualIncome = 0;
                state.salary = 0;
                state.isEmployed = false;
                state.jobType = "None";
            } else {
                state.annualIncome = 0;
                state.salary = 0;
                state.jobTitle = "Student";
                state.isEmployed = false;
            }

            syncCurrentEnrollment();
            logEvent("You enrolled in " + program.degreeName + ".");
            updateUI();
        }

        function takeGapYear() {
            if (state.isDead) return;
            state.age += 1;
            state.annualIncome = 0;
            state.salary = 0;
            state.bankBalance -= state.annualExpenses;
            state.cash = state.bankBalance;
            state.happiness += 10;
            state.health -= 1;
            logEvent("You spent a year traveling and discovering yourself.");
            showPurchaseToastMessage("Gap year taken — Happiness +10!");
            updateUI();
        }

        function HigherEducationCatalog(props) {
            const keys = HIGHER_ED_CATALOG_ORDER[state.playerPath] || [];
            const enrolled = !!state.currentlyPursuing;
            return (
                <div className="higher-ed-catalog">
                    {keys.map(function (key) {
                        const prog = EDUCATION_PROGRAMS[key];
                        if (!prog) return null;
                        const met = programPrerequisitesMet(prog);
                        const prereqText = getPrerequisiteLabel(prog) || "No prerequisites";
                        const duration = prog.yearsRequired + " Years";
                        const tuition = typeof prog.annualTuitionDebt === "number" && prog.annualTuitionDebt > 0
                            ? formatMoney(prog.annualTuitionDebt) + "/yr"
                            : prog.pipeline === "residency"
                                ? "Stipend " + formatMoney(prog.residencyStipend || 45000) + "/yr (no tuition debt)"
                                : "$0/yr";
                        const canEnroll = met && !enrolled;
                        return (
                            <div key={key} className="higher-ed-card">
                                <h4>{prog.degreeName}</h4>
                                <p className="meta">Duration: {duration}</p>
                                <p className="meta">Annual tuition (debt): {tuition}</p>
                                <p className={"meta " + (met ? "prereq-met" : "prereq-miss")}>{prereqText}</p>
                                <button
                                    type="button"
                                    className="higher-ed-enroll"
                                    disabled={!canEnroll}
                                    onClick={function () {
                                        if (!canEnroll) return;
                                        props.onEnroll(key);
                                    }}
                                >
                                    Enroll
                                </button>
                            </div>
                        );
                    })}
                </div>
            );
        }

        function mountHigherEducationCatalog() {
            if (!modalDescription) return;
            if (!higherEdCatalogRoot) {
                higherEdCatalogRoot = ReactDOM.createRoot(modalDescription);
            }
            higherEdCatalogRoot.render(
                <div>
                    <p style={{ margin: "0 0 8px", color: "#d0d0d0", fontSize: "0.92rem", lineHeight: 1.4 }}>
                        Programs for your path. Enroll is disabled while you are already in a program or if prerequisites are missing.
                    </p>
                    <HigherEducationCatalog
                        onEnroll={function (key) {
                            closeModal();
                            enrollInProgram(key);
                        }}
                    />
                </div>
            );
        }

        function openHigherEducationCatalogModal() {
            if (state.isExamModalOpen || state.isExamActive || state.isDiagnosisOverlayOpen || state.isGraduationOverlayOpen || state.isAcademicDismissalOverlayOpen) return;
            if (state.playerPath === "Trades") return;
            if (state.jobSearchBlocked) {
                openModal("Higher Education", "Career applications and new enrollments are locked until you resolve academic dismissal.", [
                    { label: "Close", handler: function () { closeModal(); } }
                ]);
                return;
            }
            if (higherEdCatalogRoot) {
                higherEdCatalogRoot.render(null);
            }
            modalTitle.textContent = "Higher Education Catalog";
            modalActions.innerHTML = "";
            const closeBtn = document.createElement("button");
            closeBtn.className = "modal-btn";
            closeBtn.textContent = "Close";
            closeBtn.addEventListener("click", function () {
                closeModal();
            });
            modalActions.appendChild(closeBtn);
            modalOverlay.style.display = "flex";
            mountHigherEducationCatalog();
        }

        function completeProgram(programKey) {
            const program = EDUCATION_PROGRAMS[programKey];
            if (!program) return;
            const savedJob = state._savedJobBeforeSchoolYear;
            if (program.pipeline === "undergrad" || !program.pipeline) {
                applyDegreeEndDebt();
            }
            state.degreeWrongAnswersThisEnrollment = 0;
            const debtLine = "You have finished your studies with " + formatMoney(state.existingDebt) + " in student debt.";

            addDegreesToHistory(program);
            program.credentials.forEach(addCredential);

            state.currentlyPursuing = null;
            state.yearsInSchool = 0;
            state.examsPassedThisDegree = 0;
            state.examsTakenThisDegree = 0;
            state.isInSchool = false;
            state.isEnrolled = false;
            state.isExamActive = false;
            state.academicDismissed = false;
            state.jobSearchBlocked = false;
            state._savedJobBeforeSchoolYear = null;
            state.educationLevel = program.educationLevel;
            evictDormIfNotEnrolled(false);

            if (program.pipeline === "residency") {
                state.jobTitle = "Unemployed";
                state.annualIncome = 0;
                state.salary = 0;
                state.isEmployed = false;
            } else if (savedJob && savedJob.isEmployed) {
                state.jobTitle = savedJob.jobTitle;
                state.annualIncome = savedJob.annualIncome;
                state.salary = savedJob.salary;
                state.isEmployed = true;
                state.jobType = savedJob.jobType === "OddJob" ? "OddJob" : "Career";
            }

            logEvent("Graduation: You earned " + program.degreeName + ".");
            syncCurrentEnrollment();

            if (programKey === "STEM_MEDICAL") {
                logEvent("Medical Residency now begins automatically.");
                enrollInProgram("STEM_RESIDENCY");
            }

            const higherEdFn = state.playerPath !== "Trades" ? function () { openHigherEducationCatalogModal(); } : null;
            triggerGraduationOverlay(
                program,
                debtLine,
                function () { openCareersTab(); },
                function () { takeGapYear(); },
                higherEdFn
            );
            updateUI();
        }

        function openEducationTab() {
            syncCurrentEnrollment();
            const program = state.currentlyPursuing ? EDUCATION_PROGRAMS[state.currentlyPursuing] : null;
            const progress = program
                ? "Currently pursuing: " + program.degreeName + " (" + state.yearsInSchool + "/" + program.yearsRequired + " years)"
                : "You are not currently enrolled in school.";
            const examProgress = program
                ? "Exam progress: " + state.examsPassedThisDegree + " passed / " + state.examsTakenThisDegree +
                    " taken (1 per year; need " + getRequiredExamPassesForProgram(program) + "/4 correct to graduate)."
                : "";
            const enrollLine = state.currentEnrollment
                ? "<br><strong>Current enrollment:</strong> " + state.currentEnrollment.degreeName +
                    " — " + state.currentEnrollment.yearsLeft + " year(s) left, " +
                    formatMoney(state.currentEnrollment.annualCost) + "/yr tuition debt."
                : "";

            const actions = [
                {
                    label: "Age Up +1 Year",
                    handler: function () {
                        closeModal();
                        ageUp();
                    }
                },
                {
                    label: "Close",
                    handler: function () {
                        closeModal();
                    }
                }
            ];

            if (state.playerPath && state.playerPath !== "Trades") {
                actions.splice(1, 0, {
                    label: "Higher Education Catalog",
                    handler: function () {
                        closeModal();
                        openHigherEducationCatalogModal();
                    }
                });
            }

            openModal(
                "Education",
                "Path: " + state.playerPath + " | Education Level: " + state.educationLevel + ". " + progress + " " + examProgress + enrollLine,
                actions
            );
        }

        function getEffectiveAnnualRentCost() {
            if (!state.currentHousing || state.currentHousing.type !== "Rent") {
                return 0;
            }
            var base = state.currentHousing.annualCost;
            if (state.roommate && (state.roommate.status === "Good" || state.roommate.status === "Bad")) {
                return Math.round(base * 0.5);
            }
            return base;
        }

        function syncFinancialAliases() {
            state.annualExpenses = Math.max(0, state.annualExpenses - state.rentExpenseInBudget);
            var newRent = getEffectiveAnnualRentCost();
            state.annualExpenses += newRent;
            state.rentExpenseInBudget = newRent;
            state.bankBalance = state.cash;
            state.expenses = state.annualExpenses;
            state.debt = getDisplayedStudentDebt();
        }

        function getRentalListingById(id) {
            for (var i = 0; i < RENTAL_LISTINGS.length; i++) {
                if (RENTAL_LISTINGS[i].id === id) return RENTAL_LISTINGS[i];
            }
            return null;
        }

        function currentRentalListingMeta() {
            if (!state.currentHousing || state.currentHousing.type !== "Rent") return null;
            return getRentalListingById(state.currentHousing.rentalId);
        }

        function clearRentalHousing() {
            state.currentHousing = null;
            state.roommate = null;
            syncFinancialAliases();
        }

        function evictDormIfNotEnrolled(silent) {
            if (!state.currentHousing || state.currentHousing.rentalId !== "dorm" || state.isEnrolled) return;
            if (!silent) {
                logEvent("You had to leave the University Dorm because you are no longer enrolled.");
            }
            state.currentHousing = null;
            state.roommate = null;
        }

        function selectRental(rentalId) {
            syncFinancialAliases();
            var listing = getRentalListingById(rentalId);
            if (!listing) return;
            if (state.ownedAssets.length > 0) {
                showPurchaseToastMessage("You already own property. Sell it before renting.");
                return;
            }
            if (listing.requiresEnrollment && !state.isEnrolled) {
                showPurchaseToastMessage("University Dorm is only available while enrolled in school.");
                return;
            }
            var balance = state.bankBalance;
            if (balance < listing.annualCost) {
                showPurchaseToastMessage("Insufficient funds. First year rent requires " + formatMoney(listing.annualCost) + " available.");
                return;
            }
            state.cash -= listing.annualCost;
            state.currentHousing = {
                type: "Rent",
                name: listing.name,
                annualCost: listing.annualCost,
                rentalId: listing.id
            };
            state.roommate = null;
            logEvent("You signed a lease: " + listing.name + ". Paid " + formatMoney(listing.annualCost) + " for the first year upfront.");
            syncFinancialAliases();
            updateUI();
        }

        function findRoommate() {
            var meta = currentRentalListingMeta();
            if (!meta || !meta.roommateEligible) return;
            if (state.roommate) {
                logEvent("You already have a roommate.");
                return;
            }
            var good = Math.random() < 0.7;
            state.roommate = { status: good ? "Good" : "Bad" };
            logEvent("You found a roommate: " + (good ? "a good match — rent is split." : "a difficult roommate — rent is split but stress may follow."));
            syncFinancialAliases();
            updateUI();
        }

        function removeRoommate() {
            if (!state.roommate) return;
            state.roommate = null;
            logEvent("Your roommate moved out. You pay full rent again.");
            syncFinancialAliases();
            updateUI();
        }

        function applyProceduralEffects(effects) {
            state.cash += effects.cash || 0;
            state.health += effects.health || 0;
            state.happiness += effects.happiness || 0;

            if (effects.death === true || state.health <= 0) {
                state.health = 0;
                onPlayerDeath();
                return true;
            }
            return false;
        }

        function generateProceduralEvent() {
            const template = proceduralEventTemplates[Math.floor(Math.random() * proceduralEventTemplates.length)];
            const event = {
                title: template.title,
                description: template.description,
                choices: template.choices.map(function (choice) {
                    return {
                        text: choice.text,
                        effects: Object.assign({}, choice.effects)
                    };
                })
            };

            event.description = event.description.replace(/\[(.*?)\]/g, function (match, tag) {
                const bank = proceduralWordBanks[tag];
                if (!bank || bank.length === 0) {
                    return match;
                }
                const totalSize = bank.length + GENERATED_WORDS_PER_BANK;
                const randomIndex = Math.floor(Math.random() * totalSize);
                return getWordFromBank(bank, GENERATED_WORDS_PER_BANK, randomIndex);
            });

            return event;
        }

        function showNextProceduralEvent() {
            if (state.isDead) return;

            if (yearlyProceduralEventRemaining <= 0) {
                updateUI();
                return;
            }

            const event = generateProceduralEvent();
            const eventIndex = yearlyProceduralEventTotal - yearlyProceduralEventRemaining + 1;
            logEvent("Event - " + event.title + ": " + event.description);

            openModal(
                event.title + " (" + eventIndex + "/" + yearlyProceduralEventTotal + ")",
                event.description + " Your choice determines the outcome.",
                event.choices.map(function (choice) {
                    return {
                        label: choice.text + " (" + describeEffects(choice.effects) + ")",
                        handler: function () {
                            const died = applyProceduralEffects(choice.effects);
                            logEvent("Outcome - " + event.title + ": " + choice.text + " -> " + describeEffects(choice.effects));
                            yearlyProceduralEventRemaining -= 1;
                            closeModal();
                            if (died || state.isDead) return;
                            updateUI();
                            showNextProceduralEvent();
                        }
                    };
                })
            );
        }

        function triggerProceduralYearEvents() {
            yearlyProceduralEventTotal = Math.floor(Math.random() * 4);
            yearlyProceduralEventRemaining = yearlyProceduralEventTotal;

            if (yearlyProceduralEventTotal === 0) {
                logEvent("A quiet, uneventful year passes by...");
                updateUI();
                return;
            }

            showNextProceduralEvent();
        }

        function getPropertyMarketDelta(property) {
            const delta = property.currentValue - property.originalPrice;
            const pct = property.originalPrice > 0 ? (delta / property.originalPrice) * 100 : 0;
            return { delta: delta, pct: pct };
        }

        function getGlobalHousingMarketShiftForYear() {
            let shift = 0;
            let eventType = "stable";
            if (Math.random() < 0.05) {
                if (Math.random() < 0.5) {
                    shift = -0.20;
                    eventType = "crash";
                    logEvent("Housing Market Crash: real estate values dropped by 20% this year.");
                } else {
                    shift = 0.20;
                    eventType = "boom";
                    logEvent("Housing Boom: real estate values jumped by 20% this year.");
                }
            }
            state.currentHousingMarketShift = shift;
            state.currentHousingMarketEvent = eventType;
        }

        function applyHousingMarketForYear() {
            getGlobalHousingMarketShiftForYear();

            state.ownedAssets.forEach(function (property) {
                const marketFluctuation = (Math.random() < 0.5 ? -1 : 1) * (0.02 + Math.random() * 0.03);
                const totalShift = marketFluctuation + state.currentHousingMarketShift;
                const prevValue = property.currentValue;
                property.currentValue = Math.max(10000, Math.round(property.currentValue * (1 + totalShift)));
                property.lastMarketFluctuation = totalShift;
                if (Math.abs(marketFluctuation) >= 0.04) {
                    const changeAmt = property.currentValue - prevValue;
                    logEvent(property.propertyType + " value " + (changeAmt >= 0 ? "rose" : "fell") + " by " + formatMoney(Math.abs(changeAmt)) + " (" + (totalShift * 100).toFixed(1) + "%).");
                }

                if (property.isMortgaged && property.remainingBalance > 0) {
                    const principalPaydown = Math.min(property.remainingBalance, Math.max(0, Math.round(property.mortgagePayment * 0.55)));
                    property.remainingBalance -= principalPaydown;
                    if (property.remainingBalance <= 0) {
                        property.remainingBalance = 0;
                        property.isMortgaged = false;
                        if (property.mortgagePayment > 0) {
                            state.annualExpenses = Math.max(0, state.annualExpenses - property.mortgagePayment);
                        }
                        property.mortgagePayment = 0;
                        logEvent(property.propertyType + " mortgage has been fully paid off.");
                    }
                }
            });

            syncFinancialAliases();
            generateRealEstateMarket();
        }

        function generateRealEstateMarket() {
            const templates = [
                { propertyType: "Starter Condo", minPrice: 120000, maxPrice: 220000, upkeepRate: 0.010 },
                { propertyType: "Suburban House", minPrice: 240000, maxPrice: 420000, upkeepRate: 0.012 },
                { propertyType: "Urban Duplex", minPrice: 300000, maxPrice: 550000, upkeepRate: 0.013 }
            ];

            state.realEstateListings = templates.map(function (tpl) {
                const basePrice = tpl.minPrice + Math.random() * (tpl.maxPrice - tpl.minPrice);
                const adjustedPrice = Math.max(50000, Math.round(basePrice * (1 + state.currentHousingMarketShift)));
                const annualUpkeep = Math.max(1000, Math.round(adjustedPrice * tpl.upkeepRate));
                const suggestedMortgagePayment = Math.max(1200, Math.round(adjustedPrice * 0.06));
                return {
                    id: state.nextListingId++,
                    propertyType: tpl.propertyType,
                    price: adjustedPrice,
                    annualUpkeep: annualUpkeep,
                    suggestedMortgagePayment: suggestedMortgagePayment
                };
            });
        }

        function buyProperty(listingId) {
            syncFinancialAliases();
            if (state.currentHousing && state.currentHousing.type === "Rent") {
                showPurchaseToastMessage("End your lease before buying property.");
                return;
            }
            const listing = state.realEstateListings.find(function (item) { return item.id === listingId; });
            if (!listing) return;

            const balance = state.bankBalance;
            const canPayInFull = balance >= listing.price;
            const downPayment = Math.round(listing.price * 0.20);
            const requiredNow = canPayInFull ? listing.price : downPayment;

            if (balance < requiredNow) {
                const msg = "Insufficient funds: need " + formatMoney(requiredNow) + " (bank " + formatMoney(balance) + ") for " + listing.propertyType + ".";
                showPurchaseToastMessage(msg);
                logEvent(msg);
                return;
            }

            let paidNow = 0;
            let isMortgaged = false;
            let remainingBalance = 0;
            let mortgagePayment = 0;

            if (canPayInFull) {
                paidNow = listing.price;
            } else {
                paidNow = downPayment;
                isMortgaged = true;
                remainingBalance = listing.price - downPayment;
                mortgagePayment = listing.suggestedMortgagePayment;
            }

            state.cash -= paidNow;
            state.annualExpenses += listing.annualUpkeep + mortgagePayment;
            syncFinancialAliases();

            state.ownedAssets.push({
                id: state.nextPropertyId++,
                propertyType: listing.propertyType,
                originalPrice: listing.price,
                currentValue: listing.price,
                annualUpkeep: listing.annualUpkeep,
                isMortgaged: isMortgaged,
                remainingBalance: remainingBalance,
                mortgagePayment: mortgagePayment,
                lastMarketFluctuation: 0
            });

            state.realEstateListings = state.realEstateListings.filter(function (item) {
                return item.id !== listingId;
            });

            if (isMortgaged) {
                logEvent("You bought " + listing.propertyType + " with a mortgage. Down payment: " + formatMoney(downPayment) + ".");

                logEvent("You bought " + listing.propertyType + " outright for " + formatMoney(listing.price) + ".");

            updateUI();

            const index = state.ownedAssets.findIndex(function (asset) { return asset.id === propertyId; });
            if (index === -1) return;

            const property = state.ownedAssets[index];
            const salePrice = Math.round(property.currentValue);
            const mortgageBalance = property.isMortgaged ? Math.round(property.remainingBalance) : 0;
            const proceeds = salePrice - mortgageBalance;

            state.cash += proceeds;
            state.annualExpenses = Math.max(0, state.annualExpenses - property.annualUpkeep - (property.isMortgaged ? property.mortgagePayment : 0));
            syncFinancialAliases();

            state.ownedAssets.splice(index, 1);

            const profitLoss = salePrice - property.originalPrice;
            const profitLossLabel = profitLoss >= 0 ? "profit" : "loss";
            logEvent("You sold your " + property.propertyType + " for " + formatMoney(salePrice) + " and pocketed " + formatMoney(proceeds) + ". " + profitLossLabel + ": " + formatMoney(Math.abs(profitLoss)) + ".");

            closeModal();

        function getCureRecoveryAmount(disease) {
            const base = Math.max(2, disease.annualHealthDrain);
            const minRecovery = Math.max(2, Math.floor(base * 0.8));
            const maxRecovery = Math.max(minRecovery + 1, Math.floor(base * 2.4));
            return minRecovery + Math.floor(Math.random() * (maxRecovery - minRecovery + 1));
        }

        function getActiveIllnessSummary() {
            if (!state.currentIllnesses.length) return "No active illnesses.";
            return state.currentIllnesses.map(function (key) {
                const disease = DISEASES[key];
                if (!disease) return "";
                const status = disease.curable ? "Curable" : "Incurable";
                return disease.name + " (" + status + ", -" + disease.annualHealthDrain + " HP/yr)";
            }).filter(Boolean).join(" | ");
        }

        function processIllnessesForYear() {
            if (!state.currentIllnesses.length) return false;

            const healthAtStart = state.health;
            const yearlyDrainRecords = [];

            for (let i = 0; i < state.currentIllnesses.length; i++) {
                const key = state.currentIllnesses[i];
                const disease = DISEASES[key];
                if (!disease) continue;

                state.illnessYears[key] = (state.illnessYears[key] || 0) + 1;
                let healthDrain = disease.annualHealthDrain;

                if (key === "hiv") {
                    const years = state.illnessYears[key];
                    healthDrain += Math.floor((years - 1) / 3) * 2;
                }

                if (disease.conditionalTriggerChance && Math.random() > disease.conditionalTriggerChance) {
                    healthDrain = 0;
                }

                yearlyDrainRecords.push({ key: key, healthDrain: healthDrain });

                if (healthDrain > 0) {
                    state.health -= healthDrain;
                }
                if (disease.annualHappinessDrain && !isMentalIllness(key)) {
                    state.happiness -= disease.annualHappinessDrain;
                }
                if (disease.annualSmartsDrain) {
                    state.smarts -= disease.annualSmartsDrain;
                }

                logEvent(disease.name + " effect: -" + healthDrain + " HP this year.");
            }

            if (state.health <= 0) {
                let selectedDeathMessage = GENERIC_HEALTH_DEATH_MESSAGE;

                if (healthAtStart > 0) {
                    let runningHealth = healthAtStart;
                    let crossingIllnessKey = null;

                    for (let i = 0; i < yearlyDrainRecords.length; i++) {
                        const record = yearlyDrainRecords[i];
                        if (record.healthDrain <= 0) continue;
                        runningHealth -= record.healthDrain;
                        if (runningHealth <= 0) {
                            crossingIllnessKey = record.key;
                            break;
                        }
                    }

                    if (crossingIllnessKey && DISEASES[crossingIllnessKey] && DISEASES[crossingIllnessKey].deathMessage) {
                        selectedDeathMessage = DISEASES[crossingIllnessKey].deathMessage;
                    }
                }

                onPlayerDeath(selectedDeathMessage);
                return true;
            }

            return false;
        }

        function maybeContractDisease() {
            if (state.currentIllnesses.length >= 4) return;
            if (Math.random() >= 0.26 * getMentalRiskMultiplier()) return;

            const available = ILLNESS_ROLL_TABLE.filter(function (entry) {
                return !state.currentIllnesses.includes(entry.key);
            });
            if (!available.length) return;

            const total = available.reduce(function (sum, entry) { return sum + entry.weight; }, 0);
            let roll = Math.random() * total;
            let selected = available[0].key;
            for (let i = 0; i < available.length; i++) {
                roll -= available[i].weight;
                if (roll <= 0) {
                    selected = available[i].key;
                    break;
                }
            }

            diagnoseIllness(selected, { forceOverlay: true });
        }

            if (state.isInSchool && state.currentlyPursuing) {
                openYearlyExamOverlay();
                return;
            }

            if (shouldTriggerRoommateEviction()) {
                state.isEvictionOverlayOpen = true;
                renderEvictionOverlay();
                updateUI();
                return;
            }

            state.age += 1;
            state.cash -= state.annualExpenses;
            state.health -= 1;
            state.happiness -= 1;

            const netIncome = state.annualIncome * 0.75;
            state.cash += netIncome;
            state.salary = state.annualIncome;
            syncFinancialAliases();

            if (state.annualIncome > 0) {
                logEvent("Age " + state.age + ": You worked as " + state.jobTitle + " and took home " + formatMoney(netIncome) + " after taxes.");
            } else {
                logEvent("Age " + state.age + ": You had no income this year.");
            }

            if (state.isEmployed && state.jobTitle !== "Student" && state.jobTitle !== "Unemployed") {
                state.yearsAtCurrentJob += 1;
            }

            if (
                state.isEmployed &&
                state.jobType === "Career" &&
                state.jobTitle !== "Student" &&
                state.jobTitle !== "Unemployed" &&
                state.jobTitle !== "Medical Resident" &&
                state.yearsAtCurrentJob >= 3 &&
                state.currentJobLevel < 4 &&
                Math.random() < 0.3
            ) {
                const promo = generatePromotion(state.jobTitle, state.annualIncome, state.currentJobLevel, state.playerPath);
                if (promo) {
                    state.pendingPromotion = {
                        newTitle: promo.newTitle,
                        newSalary: promo.newSalary,
                        level: promo.level,
                        previousSalary: state.annualIncome
                    };
                    state.isPromotionOverlayOpen = true;
                    renderPromotionOverlay();
                    updateUI();
                    return;
                }
            }

            runAgeUpWorkYearAfterPromotion();
            updateUI();
        }

        function choosePath(path) {
            state.playerPath = path;
            state.major = path;
            state.annualIncome = 0;
            state.salary = 0;
            state.jobTitle = "Student";

            if (path === "STEM") {
                enrollInProgram("STEM_BASE");
            } else if (path === "Humanities") {
                enrollInProgram("HUMANITIES_BASE");
            } else {
                enrollInProgram("TRADES_BASE");
            }
            state.happinessZeroStreakYears = 0;

            setupScreen.style.display = "none";
            gameUI.style.display = "flex";
            syncFinancialAliases();
            generateRealEstateMarket();

            logEvent("You chose the " + path + " path. Your education journey begins.");
            updateUI();
        }

        document.querySelectorAll(".major-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
                choosePath(btn.dataset.path);
            });
        });

        document.getElementById("age-up-btn").addEventListener("click", ageUp);
        function isAnyOverlayOpen() {
            return state.isExamModalOpen || state.isExamActive || state.isDiagnosisOverlayOpen ||
                state.isPromotionOverlayOpen || state.isEvictionOverlayOpen ||
                state.isGraduationOverlayOpen || state.isAcademicDismissalOverlayOpen;
        }

        document.getElementById("education-nav-btn").addEventListener("click", function () {
            if (!state.isDead && state.playerPath && !isAnyOverlayOpen()) openEducationTab();
        });
        document.getElementById("careers-nav-btn").addEventListener("click", function () {
            if (!state.isDead && state.playerPath && !isAnyOverlayOpen()) openCareersTab();
        });
        document.getElementById("activities-nav-btn").addEventListener("click", function () {
            if (!state.isDead && state.playerPath && !isAnyOverlayOpen()) openActivitiesMenu();
        });
        document.getElementById("assets-nav-btn").addEventListener("click", function () {
            if (!state.isDead && state.playerPath && !isAnyOverlayOpen()) openAssetsMenu();
        });
        document.getElementById("play-again-btn").addEventListener("click", function () {
            location.reload();
        });

        document.getElementById("resignation-confirm-btn").addEventListener("click", function () {
            closeResignationConfirm();
            quitJob();
            closeModal();
        });
        document.getElementById("resignation-stay-btn").addEventListener("click", function () {
            closeResignationConfirm();
        });

        modalOverlay.addEventListener("click", function (event) {
            if (event.target === modalOverlay) {
                closeModal();
            }
        });

        introLogo.addEventListener("animationend", function () {
            introScreen.style.display = "none";
            setupScreen.style.display = "flex";
            requestAnimationFrame(function () {
                setupScreen.style.opacity = "1";
            });
        }, { once: true });
    </script>
</body>
</html>
