<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BitBalance: ROI vs. Passion</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        #app-container {
            background-color: #121212;
            color: #E0E0E0;
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #intro-logo {
            max-width: 300px;
            width: 80%;
            animation: slideAndFade 4s ease-in-out forwards;
        }

        @keyframes slideAndFade {
            0% {
                transform: translateY(100vh);
                opacity: 1;
            }
            30% {
                transform: translateY(0);
                opacity: 1;
            }
            70% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(0);
                opacity: 0;
            }
        }

        #setup-screen {
            flex: 1;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            gap: 16px;
            text-align: center;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .title {
            margin: 0;
            font-size: 1.8rem;
            line-height: 1.2;
        }

        .subtitle {
            margin: 0;
            color: #bdbdbd;
            font-size: 0.95rem;
            max-width: 360px;
        }

        .major-grid {
            width: 100%;
            display: grid;
            gap: 12px;
            margin-top: 8px;
        }

        .major-btn {
            border: 1px solid #333;
            background: #1f1f1f;
            color: #fff;
            border-radius: 12px;
            padding: 14px 12px;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.35;
            cursor: pointer;
        }

        .major-btn strong {
            display: block;
            margin-bottom: 4px;
            font-size: 1.05rem;
        }

        .major-btn:active {
            transform: scale(0.99);
        }

        #game-ui {
            display: none;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            position: relative;
        }

        #stats-bar {
            flex-shrink: 0;
            background: #1E1E1E;
            border-bottom: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 6px;
        }

        .stats-bar-row {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            gap: 6px;
            min-height: 88px;
        }

        .stats-bar-row .stat-block {
            flex: 1;
            min-width: 0;
        }

        .hud-extra-hidden {
            display: none !important;
        }

        .stat-block {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 6px 7px;
        }

        .stat-name {
            font-size: 0.68rem;
            color: #bdbdbd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-value {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-track {
            height: 8px;
            background: #2b2b2b;
            border-radius: 999px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 50%;
            border-radius: 999px;
            transition: width 0.2s ease;
        }

        #health-fill {
            background: #FF4C4C;
        }

        #happiness-fill {
            background: #FFD700;
        }

        #smarts-fill {
            background: #4C9AFF;
        }

        #event-log {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px 188px;
            min-height: 0;
        }

        #event-log p {
            margin: 0 0 10px;
            background: #191919;
            border: 1px solid #2b2b2b;
            border-radius: 10px;
            padding: 10px 12px;
            line-height: 1.35;
            font-size: 0.95rem;
        }

        #action-area {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 65px;
            height: 0;
            flex-shrink: 0;
            z-index: 8;
            pointer-events: none;
        }

        #age-up-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #00C853, #64DD17);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.15;
            position: absolute;
            left: 50%;
            bottom: -40px;
            transform: translateX(-50%);
            z-index: 9;
            cursor: pointer;
            box-shadow: 0 16px 35px rgba(0, 200, 83, 0.5), 0 5px 12px rgba(0, 0, 0, 0.7);
            pointer-events: auto;
        }

        #age-up-btn:active {
            transform: translateX(-50%) scale(0.97);
        }

        #bottom-nav {
            flex-shrink: 0;
            height: 65px;
            background: #1E1E1E;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: stretch;
            position: relative;
            z-index: 3;
        }

        .nav-btn {
            flex: 1;
            height: 100%;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 0.92rem;
            cursor: pointer;
        }

        .nav-btn:active {
            background: rgba(255, 255, 255, 0.08);
        }

        #modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 20;
        }

        #modal-card {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 16px;
        }

        #modal-title {
            margin: 0 0 8px;
            font-size: 1.2rem;
        }

        #modal-description {
            margin: 0 0 14px;
            font-size: 0.95rem;
            color: #d2d2d2;
            line-height: 1.35;
        }

        #modal-actions {
            display: grid;
            gap: 10px;
        }

        .higher-ed-catalog {
            margin: 12px 0 0;
            max-height: 42vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .higher-ed-card {
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px 12px;
            background: #1e1e1e;
            text-align: left;
        }

        .higher-ed-card h4 {
            margin: 0 0 6px;
            font-size: 0.98rem;
        }

        .higher-ed-card .meta {
            margin: 0;
            font-size: 0.85rem;
            color: #bdbdbd;
            line-height: 1.4;
        }

        .prereq-met {
            color: #69f0ae;
        }

        .prereq-miss {
            color: #ff8a80;
        }

        .higher-ed-enroll {
            margin-top: 8px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 0.92rem;
            cursor: pointer;
        }

        .higher-ed-enroll:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #resignation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10050;
            background: rgba(0, 0, 0, 0.96);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }

        #resignation-overlay.open {
            display: flex;
        }

        #resignation-card {
            width: 100%;
            max-width: 440px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
        }

        #resignation-card h2 {
            margin: 0 0 14px;
            font-size: 1.2rem;
        }

        #resignation-card p {
            margin: 0 0 20px;
            color: #d0d0d0;
            line-height: 1.45;
            font-size: 0.98rem;
        }

        #resignation-actions {
            display: grid;
            gap: 10px;
        }

        .resignation-btn {
            width: 100%;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            cursor: pointer;
            border: 1px solid #3a3a3a;
        }

        .resignation-btn-confirm {
            background: #c62828;
            color: #fff;
            border-color: #e57373;
            font-weight: 700;
        }

        .resignation-btn-stay {
            background: #2a2a2a;
            color: #fff;
        }

        .modal-btn {
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            background: #242424;
            color: #fff;
            padding: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
        }

        .modal-btn:active {
            transform: scale(0.995);
        }

        #yearly-exam-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.98);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #yearly-exam-overlay.open {
            display: flex;
        }

        #exam-desk {
            width: 100%;
            max-width: 520px;
            border-radius: 14px;
            border: 1px solid #3a3a3a;
            background: #171717;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
            padding: 16px;
        }

        #exam-title {
            margin: 0 0 8px;
            font-size: 1.15rem;
        }

        #exam-question {
            margin: 0 0 14px;
            color: #d6d6d6;
            line-height: 1.4;
        }

        #exam-options {
            display: grid;
            gap: 10px;
        }

        .exam-option {
            width: 100%;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            background: #232323;
            color: #fff;
            text-align: left;
            padding: 18px 16px;
            font-size: 1.05rem;
            cursor: pointer;
            min-height: 64px;
        }

        .exam-option:disabled {
            opacity: 1;
            cursor: default;
        }

        .exam-option.correct {
            border-color: #33c266;
            background: #1b3d28;
        }

        .exam-option.wrong {
            border-color: #d04d4d;
            background: #451f1f;
        }

        #exam-penalty-warning {
            margin: 16px 0 0;
            font-size: 0.78rem;
            line-height: 1.35;
            color: #c9a227;
            text-align: center;
        }

        #diagnosis-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
        }

        #diagnosis-overlay.open {
            display: flex;
        }

        #diagnosis-card {
            width: 100%;
            max-width: 520px;
            border-radius: 14px;
            border: 1px solid #3a3a3a;
            background: #171717;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65);
            padding: 18px;
        }

        #diagnosis-title {
            margin: 0 0 10px;
            font-size: 1.2rem;
        }

        #diagnosis-text,
        #diagnosis-cost {
            margin: 0 0 12px;
            line-height: 1.35;
            color: #d8d8d8;
        }

        #diagnosis-actions {
            display: grid;
            gap: 10px;
        }

        .diagnosis-btn {
            width: 100%;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            background: #232323;
            color: #fff;
            text-align: left;
            padding: 13px;
            font-size: 0.98rem;
            cursor: pointer;
            min-height: 52px;
        }

        .diagnosis-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #death-screen {
            display: none;
            flex: 1;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 24px;
            gap: 14px;
        }

        #death-screen.suicide-theme {
            background: linear-gradient(180deg, #0b0f1a 0%, #101a2c 100%);
            filter: grayscale(35%);
            border-top: 1px solid #2f3c56;
        }

        #death-screen.suicide-theme #death-title {
            color: #c8d4ea;
        }

        #death-screen.suicide-theme #death-summary,
        #death-screen.suicide-theme #death-life-note {
            color: #b8c2d4;
        }

        #tombstone {
            font-size: 3rem;
            margin: 0;
        }

        #death-title {
            margin: 0;
            font-size: 1.5rem;
        }

        #death-summary,
        #death-life-note {
            margin: 0;
            color: #d6d6d6;
            line-height: 1.4;
        }

        #play-again-btn {
            margin-top: 4px;
            border: none;
            border-radius: 10px;
            background: #4C9AFF;
            color: #fff;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="yearly-exam-react-root"></div>
    <div id="app-container">
        <div id="intro-screen">
            <img src="js-games-logo.png" alt="JS Games" id="intro-logo" onerror="this.onerror=null;this.src='./js-games-logo.png';">
        </div>

        <div id="setup-screen">
            <h1 class="title">BitBalance: ROI vs. Passion</h1>
            <p class="subtitle">Choose your path and survive year by year. Build wealth without sacrificing your life.</p>
            <div class="major-grid">
                <button class="major-btn" data-path="STEM">
                    <strong>STEM</strong>
                    Build a technical foundation in science, engineering, and analytics.
                </button>
                <button class="major-btn" data-path="Humanities">
                    <strong>Humanities</strong>
                    Focus on communication, design, culture, and people-centered careers.
                </button>
                <button class="major-btn" data-path="Trades">
                    <strong>Trades</strong>
                    Train in practical, high-demand skilled work with hands-on expertise.
                </button>
            </div>
        </div>

        <div id="game-ui" style="display: none; flex-direction: column; height: 100%;">
            <header id="stats-bar">
                <div class="stats-bar-row">
                    <div class="stat-block">
                        <div class="stat-name">Health</div>
                        <div class="stat-value" id="health-text">100</div>
                        <div class="bar-track"><div id="health-fill" class="bar-fill"></div></div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-name">Happiness</div>
                        <div class="stat-value" id="happiness-text">100</div>
                        <div class="bar-track"><div id="happiness-fill" class="bar-fill"></div></div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-name">Smarts</div>
                        <div class="stat-value" id="smarts-text">50</div>
                        <div class="bar-track"><div id="smarts-fill" class="bar-fill"></div></div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-name">Cash Balance</div>
                        <div class="stat-value" id="cash-balance-text">$0</div>
                        <div class="bar-track"><div class="bar-fill" style="width: 100%; background: #888;"></div></div>
                    </div>
                </div>
                <div class="stats-bar-row hud-extra-hidden" id="stats-bar-debt-salary">
                    <div class="stat-block" id="stat-debt-block">
                        <div class="stat-name">Debt</div>
                        <div class="stat-value" id="debt-text">$0</div>
                        <div class="bar-track"><div class="bar-fill" style="width: 100%; background: #ff8a65;"></div></div>
                    </div>
                    <div class="stat-block" id="stat-salary-block">
                        <div class="stat-name">Salary</div>
                        <div class="stat-value" id="salary-text">$0</div>
                        <div class="bar-track"><div class="bar-fill" style="width: 100%; background: #81c784;"></div></div>
                    </div>
                </div>
            </header>

            <main id="event-log"></main>

            <div id="action-area">
                <button id="age-up-btn">+1 Year</button>
            </div>

            <nav id="bottom-nav">
                <button class="nav-btn" id="education-nav-btn">Education</button>
                <button class="nav-btn" id="careers-nav-btn">Careers</button>
                <button class="nav-btn" id="activities-nav-btn">Activities</button>
                <button class="nav-btn" id="assets-nav-btn">Assets</button>
            </nav>
        </div>

        <div id="modal-overlay">
            <div id="modal-card">
                <h2 id="modal-title"></h2>
                <p id="modal-description"></p>
                <div id="modal-actions"></div>
            </div>
        </div>

        <div id="resignation-overlay" aria-hidden="true">
            <div id="resignation-card">
                <h2 id="resignation-title">Confirm resignation</h2>
                <p id="resignation-text"></p>
                <div id="resignation-actions">
                    <button type="button" class="resignation-btn resignation-btn-confirm" id="resignation-confirm-btn">Confirm Resignation</button>
                    <button type="button" class="resignation-btn resignation-btn-stay" id="resignation-stay-btn">Stay at Job</button>
                </div>
            </div>
        </div>

        <div id="diagnosis-overlay-root"></div>

        <div id="death-screen">
            <p id="tombstone">🪦</p>
            <h2 id="death-title">Game Over</h2>
            <p id="death-summary"></p>
            <p id="death-life-note"></p>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script type="text/babel" data-presets="react">
        let state = {
            age: 18, health: 100, happiness: 100, smarts: 50,
            cash: 0, investments: 0, debt: 0, existingDebt: 0, salary: 0, expenses: 25000, annualExpenses: 25000, bankBalance: 0,
            major: null, isDead: false, currentIllnesses: [], illnessYears: {},
            ownedAssets: [], realEstateListings: [], nextPropertyId: 1, nextListingId: 1,
            currentHousingMarketShift: 0, currentHousingMarketEvent: "stable",
            playerPath: null, annualIncome: 0, educationLevel: "None", yearsInSchool: 0,
            currentlyPursuing: null, educationCredentials: [], jobTitle: "Unemployed",
            isExamModalOpen: false, currentExamQuestion: null, examsPassedThisDegree: 0,
            examsTakenThisDegree: 0, jobSearchBlocked: true, academicDismissed: false,
            isDiagnosisOverlayOpen: false, currentDiagnosisIllnessKey: null,
            canAccessDoctor: true, activeView: "MainGameplay",
            mentalIllnessState: {},
            happinessZeroStreakYears: 0,
            isInSchool: false,
            isExamActive: false,
            degreeWrongAnswersThisEnrollment: 0,
            hudDebtSalaryUnlocked: false,
            isEmployed: false,
            isEnrolled: false,
            degreeHistory: [],
            currentEnrollment: null,
            _savedJobBeforeSchoolYear: null
        };

        const TRACK_DEBT_BASE = {
            STEM: 30000,
            Humanities: 43000,
            Trades: 10000
        };

        const STEM_BASE_TUITION = 30000;
        const STEM_WRONG_ANSWER_PENALTY = 7500;

        const setupScreen = document.getElementById("setup-screen");
        const introScreen = document.getElementById("intro-screen");
        const introLogo = document.getElementById("intro-logo");
        const gameUI = document.getElementById("game-ui");
        const eventLog = document.getElementById("event-log");
        const modalOverlay = document.getElementById("modal-overlay");
        const modalTitle = document.getElementById("modal-title");
        const modalDescription = document.getElementById("modal-description");
        const modalActions = document.getElementById("modal-actions");
        const resignationOverlay = document.getElementById("resignation-overlay");
        const resignationText = document.getElementById("resignation-text");
        const yearlyExamReactMount = document.getElementById("yearly-exam-react-root");
        let yearlyExamReactRoot = null;
        let higherEdCatalogRoot = null;
        const diagnosisOverlayRoot = document.getElementById("diagnosis-overlay-root");
        const deathScreen = document.getElementById("death-screen");
        const deathTitle = document.getElementById("death-title");
        const deathSummary = document.getElementById("death-summary");
        const deathLifeNote = document.getElementById("death-life-note");
        const deathSound = new Audio("Danzon De Pasion (Sting) - Jimmy Fontanez_Media Right Productions.mp3");

        const healthText = document.getElementById("health-text");
        const happinessText = document.getElementById("happiness-text");
        const smartsText = document.getElementById("smarts-text");
        const cashBalanceText = document.getElementById("cash-balance-text");
        const debtText = document.getElementById("debt-text");
        const salaryText = document.getElementById("salary-text");
        const statsBarDebtSalary = document.getElementById("stats-bar-debt-salary");

        const healthFill = document.getElementById("health-fill");
        const happinessFill = document.getElementById("happiness-fill");
        const smartsFill = document.getElementById("smarts-fill");

        const randomEvents = [
            {
                name: "Market Crash",
                text: "The economy tanked.",
                choices: [
                    {
                        label: "Panic Sell",
                        requiresInvestments: true,
                        outcome: "Convert 50% of investments to cash and lose the rest.",
                        effect: function () {
                            state.cash += state.investments * 0.5;
                            state.investments = 0;
                        }
                    },
                    {
                        label: "Hold",
                        outcome: "Keep holdings, but investments immediately drop by 30%.",
                        effect: function () {
                            state.investments *= 0.70;
                        }
                    }
                ]
            },
            {
                name: "Burnout",
                text: "You can't get out of bed.",
                choices: [
                    {
                        label: "Take unpaid leave",
                        outcome: "Cash -$10,000 and Happiness +20.",
                        effect: function () {
                            state.cash -= 10000;
                            state.happiness += 20;
                        }
                    },
                    {
                        label: "Push through",
                        outcome: "Health -25.",
                        effect: function () {
                            state.health -= 25;
                        }
                    }
                ]

                const tierIdx = getMentalTierIndex(MENTAL_ILLNESS_DEFINITIONS[key].tier);
                if (tierIdx < minTierIdx || tierIdx > maxTierIdx) return false;
                if (config.excludeActive && state.currentIllnesses.includes(key)) return false;
                return true;
            });
            if (!candidates.length) return null;
            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function getTrackDebtBase(path) {
            return TRACK_DEBT_BASE[path] || 0;
        }

        function getDisplayedStudentDebt() {
            if (state.playerPath === "STEM") {
                return state.existingDebt;
            }
            if (state.isInSchool && state.currentlyPursuing) {
                const base = getTrackDebtBase(state.playerPath);
                return state.existingDebt + (base / 4) * state.degreeWrongAnswersThisEnrollment;
            }
            return state.existingDebt;
        }

        function applyDegreeEndDebt() {
            let added = 0;
            if (state.playerPath !== "STEM") {
                const base = getTrackDebtBase(state.playerPath);
                added = (base / 4) * state.degreeWrongAnswersThisEnrollment;
                state.existingDebt += added;
            }
            return added;
        }

        function syncCurrentEnrollment() {
            const program = state.currentlyPursuing ? EDUCATION_PROGRAMS[state.currentlyPursuing] : null;
            if (!program || !state.isInSchool) {
                state.currentEnrollment = null;
                return;
            }
            const yearsLeft = Math.max(0, program.yearsRequired - state.yearsInSchool);
            const annualCost = typeof program.annualTuitionDebt === "number" ? program.annualTuitionDebt : 0;
            state.currentEnrollment = {
                degreeName: program.degreeName,
                yearsLeft: yearsLeft,
                annualCost: annualCost,
                programKey: state.currentlyPursuing
            };
        }

        function programPrerequisitesMet(program) {
            if (!program || !program.prerequisiteDegreeNames || !program.prerequisiteDegreeNames.length) {
                return true;
            }
            return program.prerequisiteDegreeNames.every(function (name) {
                return state.degreeHistory.indexOf(name) !== -1;
            });
        }

        function getPrerequisiteLabel(program) {
            if (!program.prerequisiteDegreeNames || !program.prerequisiteDegreeNames.length) {
                return "";
            }
            return "Requires " + program.prerequisiteDegreeNames.join(" + ");
        }

        function addDegreesToHistory(program) {
            if (!program || !program.degreeName) return;
            if (state.degreeHistory.indexOf(program.degreeName) === -1) {
                state.degreeHistory.push(program.degreeName);
            }
        }

        function applyAdvancedTuitionDebt(program) {
            if (!program || program.pipeline === "undergrad" || program.pipeline === "residency") return;
            const amt = typeof program.annualTuitionDebt === "number" ? program.annualTuitionDebt : 0;
            if (amt > 0) {
                state.existingDebt += amt;
            }
        }

        function maybeTriggerDualHustleBurnout() {
            const p = state.currentlyPursuing ? EDUCATION_PROGRAMS[state.currentlyPursuing] : null;
            if (p && p.pipeline === "residency") return;
            if (!state.isEmployed || !state.isEnrolled) return;

            if (state.currentIllnesses.includes("severeAcademicBurnout")) return;
            if (Math.random() >= 0.5) return;
            diagnoseIllness("severeAcademicBurnout", { skipHappinessPenalty: true, forceOverlay: true });
            logEvent("Dual hustle overload: Severe Academic Burnout diagnosed.");

        function clampStat(num) {
            if (num < 0) return 0;
            if (num > 100) return 100;
            return num;
        }

            syncCurrentEnrollment();
            syncFinancialAliases();
            state.health = clampStat(state.health);

            state.smarts = clampStat(state.smarts);

            healthText.textContent = Math.round(state.health);
            happinessText.textContent = Math.round(state.happiness);
            smartsText.textContent = Math.round(state.smarts);

            if (state.hudDebtSalaryUnlocked && statsBarDebtSalary) {

            eventLog.appendChild(p);

        function formatSignedMoney(value) {
            const abs = Math.abs(value);
            return (value >= 0 ? "+" : "-") + formatMoney(abs);
        }

        function describeEffects(effects) {
            const parts = [];
            if (typeof effects.cash === "number" && effects.cash !== 0) {
                parts.push(formatSignedMoney(effects.cash) + " Cash");
            }
            if (typeof effects.health === "number" && effects.health !== 0) {
                parts.push((effects.health > 0 ? "+" : "") + effects.health + " Health");
            }
            if (typeof effects.happiness === "number" && effects.happiness !== 0) {
                parts.push((effects.happiness > 0 ? "+" : "") + effects.happiness + " Happiness");
            }
            if (effects.death === true) {
                parts.push("Fatal");
            }
            return parts.length ? parts.join(" | ") : "No immediate change";
        }

                if (action.disabled) {
                    btn.disabled = true;
                    btn.style.opacity = "0.45";
                    btn.style.cursor = "not-allowed";
                }
                btn.addEventListener("click", function () {
                    action.handler();
                });
                modalActions.appendChild(btn);
            });

        function escapeHtml(text) {

        function DiagnosisOverlay(props) {

        function renderDiagnosisOverlay() {
            if (!state.isDiagnosisOverlayOpen || !state.currentDiagnosisIllnessKey) {
                diagnosisOverlayRoot.innerHTML = "";

            }

            diagnosisOverlayRoot.innerHTML = DiagnosisOverlay({

        function applyMentalDefaultsForIllness(illnessKey, disease) {
            if (!isMentalIllness(illnessKey)) return;
            if (!state.mentalIllnessState[illnessKey]) {
                let requiredVisits = 0;
                if (disease.mentalCurable && typeof disease.mentalMinVisits === "number" && typeof disease.mentalMaxVisits === "number") {
                    requiredVisits = randomIntBetween(disease.mentalMinVisits, disease.mentalMaxVisits);
                }
                state.mentalIllnessState[illnessKey] = {
                    isSuppressed: false,
                    requiredVisitsRemaining: requiredVisits
                };
            } else {
                state.mentalIllnessState[illnessKey].isSuppressed = false;
            }
        }

        function closeDiagnosisOverlay() {
            state.isDiagnosisOverlayOpen = false;
            state.currentDiagnosisIllnessKey = null;
            diagnosisOverlayRoot.innerHTML = "";
        }

        function openDiagnosisOverlayForIllness(illnessKey) {
            if (!DISEASES[illnessKey]) return;
            closeModal();
            state.isDiagnosisOverlayOpen = true;
            state.currentDiagnosisIllnessKey = illnessKey;
            renderDiagnosisOverlay();
        }

        function openDoctorComponent() {
            state.activeView = "DoctorComponent";
            openDoctorMenu();
        }

        function openPsychiatristFromOverlay() {
            state.activeView = "PsychiatristService";
            openAssetsMenu(true);
        }

        function diagnoseIllness(illnessKey, options) {
            const disease = DISEASES[illnessKey];
            const config = options || {};
            if (!disease) return false;

            const alreadyHasIllness = state.currentIllnesses.includes(illnessKey);
            if (!alreadyHasIllness) {
                if (state.currentIllnesses.length >= 4) return false;
                state.currentIllnesses.push(illnessKey);
                state.illnessYears[illnessKey] = 0;
                applyMentalDefaultsForIllness(illnessKey, disease);
            }

            if (config.setHappinessZero) {
                state.happiness = 0;
            } else if (!config.skipHappinessPenalty && !alreadyHasIllness) {
                state.happiness -= HAPPINESS_PENALTY_ON_DIAGNOSIS;
            }

            if (disease.oneTimeHealthHit && !alreadyHasIllness) {
                state.health -= disease.oneTimeHealthHit;
                logEvent("You were diagnosed with " + disease.name + ". Immediate health impact: -" + disease.oneTimeHealthHit + " HP.");
            } else if (!alreadyHasIllness) {
                logEvent("You were diagnosed with " + disease.name + ".");
            }

            if (state.health <= 0) {
                onPlayerDeath(disease.deathMessage || GENERIC_HEALTH_DEATH_MESSAGE);
                return true;
            }

            if (!alreadyHasIllness || config.forceOverlay) {
                openDiagnosisOverlayForIllness(illnessKey);
            }
            return true;
        }

        function visitPsychiatrist() {
            closeDiagnosisOverlay();
            if (state.cash < PSYCHIATRIST_VISIT_COST) {
                logEvent("You couldn't afford a psychiatrist visit.");
                closeModal();
                updateUI();
                return;
            }

            const activeMentalIllnesses = state.currentIllnesses.filter(function (key) { return isMentalIllness(key); });
            if (!activeMentalIllnesses.length) {
                logEvent("You attended psychiatry, but had no active mental illnesses to treat.");
                closeModal();
                updateUI();
                return;
            }

            state.cash -= PSYCHIATRIST_VISIT_COST;
            const cured = [];
            let visitProgressMade = false;

            activeMentalIllnesses.forEach(function (illnessKey) {
                const disease = DISEASES[illnessKey];
                applyMentalDefaultsForIllness(illnessKey, disease);
                const mentalState = state.mentalIllnessState[illnessKey];
                mentalState.isSuppressed = true;

                if (disease.mentalCurable && mentalState.requiredVisitsRemaining > 0) {
                    mentalState.requiredVisitsRemaining -= 1;
                    visitProgressMade = true;
                    if (mentalState.requiredVisitsRemaining <= 0) {
                        cured.push(illnessKey);
                    }
                }
            });

            if (cured.length) {
                state.currentIllnesses = state.currentIllnesses.filter(function (key) {
                    return !cured.includes(key);
                });
                cured.forEach(function (illnessKey) {
                    delete state.illnessYears[illnessKey];
                    delete state.mentalIllnessState[illnessKey];
                });
                logEvent("Psychiatry sessions resolved: " + cured.map(function (key) { return DISEASES[key].name; }).join(", ") + ".");
            } else {
                logEvent("You visited the psychiatrist. Mental illness symptoms were suppressed this year." + (visitProgressMade ? " You are making treatment progress." : ""));
            }

            closeModal();
            updateUI();
        }

        function applyAnnualMentalHealthLogic() {
            const activeMentalIllnesses = state.currentIllnesses.filter(function (key) {
                return isMentalIllness(key);
            });
            if (!activeMentalIllnesses.length) {
                if (state.happiness > 80) {
                    state.happiness += 5;
                    logEvent("Mental Clarity: with no active mental illnesses, you gained +5 Happiness.");
                }
                return;
            }

            let hadUnsuppressedAtZero = false;
            let highestTier = "mild";

            activeMentalIllnesses.forEach(function (illnessKey) {
                const disease = DISEASES[illnessKey];
                applyMentalDefaultsForIllness(illnessKey, disease);
                const mentalState = state.mentalIllnessState[illnessKey];
                const tier = disease.mentalTier || "mild";
                if (getMentalTierIndex(tier) > getMentalTierIndex(highestTier)) {
                    highestTier = tier;
                }

                const baseDrain = MENTAL_TIER_HAPPINESS_DRAIN[tier] || 10;
                const appliedDrain = mentalState.isSuppressed
                    ? Math.round(baseDrain * MENTAL_HEALTH_SUPPRESSION_FACTOR)
                    : baseDrain;

                state.happiness -= appliedDrain;
                logEvent(disease.name + " mental strain: -" + appliedDrain + " Happiness this year" + (mentalState.isSuppressed ? " (suppressed)." : "."));
                if (!mentalState.isSuppressed && state.happiness <= 0) {
                    hadUnsuppressedAtZero = true;
                }
            });

            if (hadUnsuppressedAtZero && Math.random() < 0.5) {
                const currentTierIndex = getMentalTierIndex(highestTier);
                const worseningTier = MENTAL_TIER_ORDER[Math.min(MENTAL_TIER_ORDER.length - 1, currentTierIndex + 1)];
                const worseningIllness = getRandomMentalIllnessKey({ minTier: worseningTier, maxTier: "severe", excludeActive: true });
                if (worseningIllness) {
                    diagnoseIllness(worseningIllness, { skipHappinessPenalty: true, forceOverlay: true });
                    logEvent("Mental health worsened due to neglect.");
                }
            }
        }

        function maybeTriggerPathBasedMentalDiagnosis() {
            const hasDebtPressure = state.cash < 0 || state.debt > 0;
            const isJobLossScenario = state.jobTitle !== "Student" && state.jobTitle !== "Unemployed" && state.annualIncome <= 0;
            const hasAcademicFailure = state.academicDismissed;
            if (!hasDebtPressure && !isJobLossScenario && !hasAcademicFailure) {
                return;
            }

            const baselineChance = 0.18;
            const chance = baselineChance * getMentalRiskMultiplier();
            if (Math.random() >= chance) return;

            const key = getRandomMentalIllnessKey({ excludeActive: true });
            if (key) {
                diagnoseIllness(key, { forceOverlay: true });
            }
        }

        function handleSuicideDeath() {
            triggerDeath(SUICIDE_DEATH_MESSAGE, "suicide");
        }

        function maybeTriggerDepressionFromLowStats() {
            if (state.currentIllnesses.includes("depression")) return false;
            if (state.happiness > 0) return false;
            return diagnoseIllness("depression", { setHappinessZero: true, skipHappinessPenalty: true });
        }

        function getRequiredExamPassesForProgram(program) {
            if (program && program.pipeline && program.pipeline !== "undergrad") {
                return Math.ceil(program.yearsRequired * 0.5);
            }
            const byRatio = Math.ceil(program.yearsRequired * 0.75);
            if (program.yearsRequired >= 4) {
                return Math.max(3, byRatio);
            }
            return byRatio;
        }

        function handleAcademicDismissal(program, requiredPasses) {
            const passedCount = state.examsPassedThisDegree;

            if (program && program.pipeline && program.pipeline !== "undergrad") {
                handleAdvancedAcademicDismissal(program, requiredPasses);

            applyDegreeEndDebt();
            state.degreeWrongAnswersThisEnrollment = 0;

            openModal(

                "<strong>You did not meet the graduation exam requirement.</strong><br><br>You passed " + passedCount + "/" + program.yearsRequired +
                " exams (minimum required: " + requiredPasses + "). You must restart " +
                program.degreeName + " from Year 1. Careers and Find a Job stay locked until you graduate successfully.<br><br>" + debtLine,
                [
