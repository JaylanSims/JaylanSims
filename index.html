        }

        function openActivitiesMenu() {
            openModal("Activities", "Spend resources to recover your life stats.", [
                {
                    label: "Therapy ($2k)",
                    handler: function () {
                        applyActionWithRefresh("You invested in therapy.", function () {
                            if (state.cash >= 2000) {
                                state.cash -= 2000;
                                state.happiness += 25;
                            } else {
                                state.happiness += 5;
                                logEvent("You couldn't afford a full session, but deciding to seek help still improved your mood.");
                            }
                        });
                    }
                },
                {
                    label: "Gym ($500)",
                    handler: function () {
                        applyActionWithRefresh("You spent time at the gym.", function () {
                            if (state.cash >= 500) {
                                state.cash -= 500;
                                state.health += 15;
                            } else {
                                logEvent("You couldn't afford the gym.");
                            }
                        });
                    }
                },
                {
                    label: "Read (Free)",
                    handler: function () {
                        applyActionWithRefresh("You read and learned something new.", function () {
                            state.smarts += 5;
                        });
                    }
                },
                {
                    label: "Visit Doctor",
                    handler: function () {
                        openDoctorMenu();
                    }
                },
                {
                    label: "Close",
                    handler: function () {
                        closeModal();
                    }
                }
            ]);
        }

        function openAssetsMenu(focusPsychiatrist) {
            if (state.realEstateListings.length === 0) {
                generateRealEstateMarket();
            }
            syncFinancialAliases();
            const currentNetWorth = state.cash + state.investments - state.debt;
            const canInvest = state.bankBalance > 0 && currentNetWorth > 0;
            const marketLabel = state.currentHousingMarketEvent === "crash"
                ? "<span style=\"color:#ff6b6b;\">Market Mood: Crash (-20%)</span>"
                : state.currentHousingMarketEvent === "boom"
                    ? "<span style=\"color:#69f0ae;\">Market Mood: Boom (+20%)</span>"
                    : "<span style=\"color:#bdbdbd;\">Market Mood: Stable</span>";

            const myPropertiesHtml = state.ownedAssets.length
                ? state.ownedAssets.map(function (property) {
                    const delta = getPropertyMarketDelta(property);
                    const up = delta.delta > 0;
                    const down = delta.delta < 0;
                    const color = up ? "#69f0ae" : down ? "#ff6b6b" : "#bdbdbd";
                    const marker = up ? "▲" : down ? "▼" : "■";
                    const mortgageText = property.isMortgaged ? "Mortgage: " + formatMoney(property.remainingBalance) : "No mortgage";
                    return "<div style=\"margin-bottom:8px;\">" +
                        "<strong>" + property.propertyType + "</strong><br>" +
                        "Original: " + formatMoney(property.originalPrice) + " | Current: " + formatMoney(property.currentValue) + "<br>" +
                        "<span style=\"color:" + color + ";\">" + marker + " " + (up ? "+" : "") + delta.pct.toFixed(1) + "%</span> | " + mortgageText +
                        "</div>";
                }).join("")
                : "<div style=\"color:#bdbdbd; margin-bottom:8px;\">No properties owned.</div>";

            const listingsHtml = state.realEstateListings.map(function (listing) {
                return "<div style=\"margin-bottom:6px;\"><strong>" + listing.propertyType + "</strong> - " +
                    formatMoney(listing.price) + " (Upkeep " + formatMoney(listing.annualUpkeep) + "/yr)</div>";
            }).join("");

            const actions = [];
            state.ownedAssets.forEach(function (property) {
                actions.push({
                    label: "Sell " + property.propertyType,
                    handler: function () {
                        openSellPropertyConfirmation(property.id);
                    }
                });
            });

            const bankBal = state.bankBalance;
            state.realEstateListings.forEach(function (listing) {
                const downPayment = Math.round(listing.price * 0.20);
                const canPayFull = bankBal >= listing.price;
                const required = canPayFull ? listing.price : downPayment;
                const canBuy = bankBal >= required;
                const priceLabel = formatMoney(listing.price);
                const reqLabel = formatMoney(required);
                actions.push({
                    label: canBuy
                        ? "Buy for " + priceLabel + (canPayFull ? " (cash)" : " (20% down " + reqLabel + ")")
                        : "Insufficient Funds (Requires " + reqLabel + ")",
                    disabled: !canBuy,
                    buttonVariant: canBuy ? "buyAfford" : "buyDeny",
                    handler: function () {
                        if (!canBuy) {
                            showPurchaseToastMessage("Insufficient funds. Need " + reqLabel + " (have " + formatMoney(bankBal) + ").");
                            return;
                        }
                        buyProperty(listing.id);
                    }
                });
            });

            actions.push({
                label: canInvest ? "Invest 50% Cash" : "Insufficient Funds (Invest Unavailable)",
                disabled: !canInvest,
                handler: function () {
                    if (!canInvest) {
                        showPurchaseToastMessage("Insufficient funds in your bank balance to invest.");
                        return;
                    }
                    applyActionWithRefresh("You invested 50% cash, and your net worth dropped by 50%.", function () {
                        const amt = state.cash * 0.5;
                        state.cash -= amt;
                        state.investments += amt;
                        const netWorthBeforeDrop = state.cash + state.investments - state.debt;
                        const netWorthDrop = Math.abs(netWorthBeforeDrop) * 0.50;
                        state.cash -= netWorthDrop;
                    });
                }
            });
            actions.push({
                label: canInvest ? "Contribute 10% Cash" : "Insufficient Funds (Contribute Unavailable)",
                disabled: !canInvest,
                handler: function () {
                    if (!canInvest) {
                        showPurchaseToastMessage("Insufficient funds in your bank balance to contribute.");
                        return;
                    }
                    applyActionWithRefresh("You contributed 10% cash, and your net worth dropped by 10%.", function () {
                        const amt = state.cash * 0.10;
                        state.cash -= amt;
                        state.investments += amt;
                        const netWorthBeforeDrop = state.cash + state.investments - state.debt;
                        const netWorthDrop = Math.abs(netWorthBeforeDrop) * 0.10;
                        state.cash -= netWorthDrop;
                    });
                }
            });
            actions.push({
                label: (focusPsychiatrist ? "➡ " : "") + "Psychiatrist (" + formatMoney(PSYCHIATRIST_VISIT_COST) + ")",
                handler: function () {
                    visitPsychiatrist();
                }
            });
            actions.push({
                label: "Close",
                handler: function () {
                    closeModal();
                }
            });

            openModal(
                "Assets",
                marketLabel + "<br><br><strong>My Properties</strong><br>" + myPropertiesHtml +
                "<br><strong>Broker Listings</strong><br>" + listingsHtml,
                actions
            );
        }

        function openPsychiatristService() {
            openModal(
                "Psychiatrist Service",
                "Cost per visit: " + formatMoney(PSYCHIATRIST_VISIT_COST) + ". This suppresses all active mental illnesses for the year and can cure curable mental illnesses over repeated visits.",
                [
                    {
                        label: "Visit Psychiatrist (" + formatMoney(PSYCHIATRIST_VISIT_COST) + ")",
                        handler: function () {
                            visitPsychiatrist();
                        }
                    },
                    {
                        label: "Close",
                        handler: function () {
                            closeModal();
                        }
                    }
                ]
            );
        }

        function openRelationshipsMenu() {
            openModal("Relationships", "Invest in your connections to improve quality of life.", [
                {
                    label: "Date Night ($1.5k)",
                    handler: function () {
                        applyActionWithRefresh("You invested in a date night.", function () {
                            if (state.cash >= 1500) {
                                state.cash -= 1500;
                                state.happiness += 18;
                            } else {
                                logEvent("You couldn't afford date night.");
                            }
                        });
                    }
                },
                {
                    label: "Call Family (Free)",
                    handler: function () {
                        applyActionWithRefresh("You called family and recharged emotionally.", function () {
                            state.happiness += 10;
                        });
                    }
                },
                {
                    label: "Networking Event ($1k)",
                    handler: function () {
                        applyActionWithRefresh("You attended a networking event.", function () {
                            if (state.cash >= 1000) {
                                state.cash -= 1000;
                                state.salary *= 1.05;
                                state.happiness -= 4;
                            } else {
                                logEvent("You couldn't afford the networking event.");
                            }
                        });
                    }
                },
                {
                    label: "Close",
                    handler: function () {
                        closeModal();
                    }
                }
            ]);
        }

        function triggerRandomEvent() {
            const eventObj = randomEvents[Math.floor(Math.random() * randomEvents.length)];
            logEvent("Event - " + eventObj.name + ": " + eventObj.text);
            const actions = eventObj.choices.map(function (choice) {
                const unavailable = choice.requiresInvestments && state.investments <= 0;
                return {
                    label: unavailable
                        ? choice.label + " (Unavailable: no investments)"
                        : choice.label + " (" + choice.outcome + ")",
                    disabled: unavailable,
                    handler: function () {
                        if (unavailable) {
                            return;
                        }
                        choice.effect();
                        logEvent("Outcome - " + eventObj.name + ": " + choice.label + " -> " + choice.outcome);
                        if (state.health <= 0) {
                            closeModal();
                            onPlayerDeath();
                            return;
                        }
                        closeModal();
                        updateUI();
                    }
                };
            });
            openModal(eventObj.name, eventObj.text, actions);
        }

        function triggerDeath(customDeathMessage, deathType) {
            state.isDead = true;
            closeModal();
            closeYearlyExamOverlay();
            closePromotionOverlay();
            closePerformanceReviewOverlay();
            closeEvictionOverlay();
            closeDiagnosisOverlay();
            gameUI.style.display = "none";
            deathScreen.style.display = "flex";

            const netWorth = state.cash + state.investments - state.debt;
            const causeMessage = customDeathMessage || GENERIC_HEALTH_DEATH_MESSAGE;
            deathSummary.textContent = causeMessage + " You died at Age " + state.age + ". Final Net Worth: " + formatMoney(netWorth) + ".";

            deathScreen.classList.remove("suicide-theme");
            if (deathType === "suicide") {
                deathTitle.textContent = "A Heartbreaking End";
                deathScreen.classList.add("suicide-theme");
                deathSummary.textContent = causeMessage;
                deathLifeNote.textContent = "Please seek support immediately if you or someone you know is in crisis.";
            } else {
                deathTitle.textContent = "Game Over";
                if (state.happiness > 80) {
                    deathLifeNote.textContent = "You lived a deeply happy life.";
                } else if (state.happiness < 40) {
                    deathLifeNote.textContent = "You died stressed and miserable.";
                } else {
                    deathLifeNote.textContent = "A perfectly average life.";
                }
            }
        }

        function onPlayerDeath(customDeathMessage) {
            deathSound.currentTime = 0;
            deathSound.play();
            triggerDeath(customDeathMessage);
            console.log("Player has died!");
        }

        function runAgeUpWorkYearAfterPromotion() {
            addCareerExperienceIfEligible();
            state.investments *= (1 + (Math.random() * 0.25 - 0.10));
            applyHousingMarketForYear();

            if (processIllnessesForYear()) {
                yearlyResetMentalSuppression();
                return;
            }
            applyAnnualMentalHealthLogic();
            if (state.isDead) {
                yearlyResetMentalSuppression();
                return;
            }
            maybeTriggerPathBasedMentalDiagnosis();
            if (state.isDiagnosisOverlayOpen || state.isDead) {
                yearlyResetMentalSuppression();
                updateUI();
                return;
            }
            maybeContractDisease();
            if (state.isDiagnosisOverlayOpen || state.isDead) {
                yearlyResetMentalSuppression();
                updateUI();
                return;
            }
            maybeTriggerDepressionFromLowStats();
            if (state.isDiagnosisOverlayOpen || state.isDead) {
                yearlyResetMentalSuppression();
                updateUI();
                return;
            }
            maybeTriggerSellingOutCareerIllness();
            if (state.isDiagnosisOverlayOpen || state.isDead) {
                yearlyResetMentalSuppression();
                updateUI();
                return;
            }

            if (state.happiness <= 0) {
                state.happinessZeroStreakYears += 1;
            } else {
                state.happinessZeroStreakYears = 0;
            }
            if (state.happinessZeroStreakYears >= 2) {
                handleSuicideDeath();
                yearlyResetMentalSuppression();
                return;
            }

            if (state.health <= 0) {
                onPlayerDeath(GENERIC_HEALTH_DEATH_MESSAGE);
                yearlyResetMentalSuppression();
                return;
            }

            pushYearEndHappinessAndReviewTick();
            if (maybeOpenPerformanceReviewOverlay()) {
                updateUI();
                return;
            }

            yearlyResetMentalSuppression();
            triggerProceduralYearEvents();
            updateUI();
        }

        function ageUp() {
            if (state.isDead || !state.playerPath || state.isExamModalOpen || state.isExamActive || state.isDiagnosisOverlayOpen || state.isPromotionOverlayOpen || state.isPerformanceReviewOverlayOpen || state.isEvictionOverlayOpen) return;

            if (state.isInSchool && state.currentlyPursuing) {
                openYearlyExamOverlay();
                return;
            }

            if (shouldTriggerRoommateEviction()) {
                state.isEvictionOverlayOpen = true;
                renderEvictionOverlay();
                updateUI();
                return;
            }

            state.age += 1;
            state.cash -= state.annualExpenses;
            state.health -= 1;
            state.happiness -= 1;

            const netIncome = state.annualIncome * 0.75;
            state.cash += netIncome;
            state.salary = state.annualIncome;
            syncFinancialAliases();

            if (state.annualIncome > 0) {
                logEvent("Age " + state.age + ": You worked as " + state.jobTitle + " and took home " + formatMoney(netIncome) + " after taxes.");
            } else {
                logEvent("Age " + state.age + ": You had no income this year.");
            }

            if (state.isEmployed && state.jobTitle !== "Student" && state.jobTitle !== "Unemployed") {
                state.yearsAtCurrentJob += 1;
            }

            if (
                state.isEmployed &&
                state.jobType === "Career" &&
                state.jobTitle !== "Student" &&
                state.jobTitle !== "Unemployed" &&
                state.jobTitle !== "Medical Resident" &&
                state.yearsAtCurrentJob >= 3 &&
                state.currentJobLevel < 4 &&
                Math.random() < getPromotionTriggerChance()
            ) {
                const promo = generatePromotion(state.jobTitle, state.annualIncome, state.currentJobLevel, state.playerPath);
                if (promo) {
                    state.pendingPromotion = {
                        newTitle: promo.newTitle,
                        newSalary: promo.newSalary,
                        level: promo.level,
                        previousSalary: state.annualIncome
                    };
                    state.isPromotionOverlayOpen = true;
                    renderPromotionOverlay();
                    updateUI();
                    return;
                }
            }

            maybeAlignmentCareerToast();

            runAgeUpWorkYearAfterPromotion();
            updateUI();
        }

        function choosePath(path) {
            if (state.naturalAptitude == null) {
                state.naturalAptitude = rollNaturalAptitude();
            }
            state.playerPath = path;
            state.major = path;
            var matchTrack = pathForAptitude(state.naturalAptitude);
            openModal(
                "Your Natural Aptitude",
                "You have discovered your natural aptitude is <strong>" + state.naturalAptitude + "</strong>. " +
                    "Following a career in <strong>" + matchTrack + "</strong> will bring you fulfillment and rapid success. " +
                    "Forcing yourself into other tracks for money will lead to severe stress and a higher chance of academic failure.",
                [
                    {
                        label: "Continue",
                        handler: function () {
                            closeModal();
                            state.annualIncome = 0;
                            state.salary = 0;
                            state.jobTitle = "Student";

                            if (path === "STEM") {
                                enrollInProgram("STEM_BASE");
                            } else if (path === "Humanities") {
                                enrollInProgram("HUMANITIES_BASE");
                            } else {
                                enrollInProgram("TRADES_BASE");
                            }
                            state.happinessZeroStreakYears = 0;

                            setupScreen.style.display = "none";
                            gameUI.style.display = "flex";
                            syncFinancialAliases();
                            generateRealEstateMarket();

                            logEvent("You chose the " + path + " path. Your education journey begins.");
                            updateUI();
                        }
                    }
                ]
            );
        }

        document.querySelectorAll(".major-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
                choosePath(btn.dataset.path);
            });
        });

        document.getElementById("age-up-btn").addEventListener("click", ageUp);
        document.getElementById("education-nav-btn").addEventListener("click", function () {
            if (!state.isDead && state.playerPath && !state.isExamModalOpen && !state.isExamActive && !state.isDiagnosisOverlayOpen && !state.isPromotionOverlayOpen && !state.isPerformanceReviewOverlayOpen && !state.isEvictionOverlayOpen) openEducationTab();
        });
        document.getElementById("careers-nav-btn").addEventListener("click", function () {
            if (!state.isDead && state.playerPath && !state.isExamModalOpen && !state.isExamActive && !state.isDiagnosisOverlayOpen && !state.isPromotionOverlayOpen && !state.isPerformanceReviewOverlayOpen && !state.isEvictionOverlayOpen) openCareersTab();
        });
        document.getElementById("activities-nav-btn").addEventListener("click", function () {
            if (!state.isDead && state.playerPath && !state.isExamModalOpen && !state.isExamActive && !state.isDiagnosisOverlayOpen && !state.isPromotionOverlayOpen && !state.isPerformanceReviewOverlayOpen && !state.isEvictionOverlayOpen) openActivitiesMenu();
        });
        document.getElementById("assets-nav-btn").addEventListener("click", function () {
            if (!state.isDead && state.playerPath && !state.isExamModalOpen && !state.isExamActive && !state.isDiagnosisOverlayOpen && !state.isPromotionOverlayOpen && !state.isPerformanceReviewOverlayOpen && !state.isEvictionOverlayOpen) openAssetsMenu();
        });
        document.getElementById("play-again-btn").addEventListener("click", function () {
            location.reload();
        });

        document.getElementById("resignation-confirm-btn").addEventListener("click", function () {
            closeResignationConfirm();
            quitJob();
            closeModal();
        });
        document.getElementById("resignation-stay-btn").addEventListener("click", function () {
            closeResignationConfirm();
        });

        modalOverlay.addEventListener("click", function (event) {
            if (event.target === modalOverlay) {
                closeModal();
            }
        });

        introLogo.addEventListener("animationend", function () {
            introScreen.style.display = "none";
            setupScreen.style.display = "flex";
            requestAnimationFrame(function () {
                setupScreen.style.opacity = "1";
            });
        }, { once: true });
    </script>
</body>
</html>
